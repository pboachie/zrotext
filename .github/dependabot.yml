version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # One PR per week for minor and patch version updates. Groups apply to
    # version updates only, so security updates still open immediately.
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # One PR per week for minor and patch version updates. Groups apply to
    # version updates only, so security updates still open immediately.
    groups:
      cargo-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    # One PR per week for minor and patch version updates. Groups apply to
    # version updates only, so security updates still open immediately.
    groups:
      gradle-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: docker
    directory: /deploy/compose
    schedule:
      interval: weekly
    ignore:
      # The rust build image version must equal rust-toolchain.toml, so it
      # moves only in a toolchain bump PR (the image build fails otherwise).
      - dependency-name: rust
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
