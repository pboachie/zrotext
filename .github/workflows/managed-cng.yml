name: Managed candidate Windows protected recipient
on:
  pull_request:
    paths:
      - 'sdk/native/crypto-envelope/csharp/**'
      - 'sdk/native/crypto-candidate/csharp/**'
      - '.github/workflows/managed-cng.yml'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  managed-cng:
    strategy:
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '8.0.x'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a5fb59c2c5bc81e80b5b8d4b836afd51c5304653
          path: producer
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.13.0'
      - name: Build independent producer
        shell: pwsh
        run: |
          npm ci --prefix producer/sdk/typescript
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build --prefix producer/sdk/typescript
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Qualify hardware or report unavailable before creation
        shell: pwsh
        run: |
          dotnet run --project sdk/native/crypto-envelope/csharp/custody/CustodyTest.csproj -- producer/sdk/native/sealed-candidate/python "$env:RUNNER_TEMP/managed-cng-pending.txt"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
