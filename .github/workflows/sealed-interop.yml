name: Sealed cross-client tests

on:
  pull_request:
    # Not a required check. Main runs it for every push; a pull request runs it
    # only when a file the cross-client build or tests read changes.
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'deploy/compose/migrations/**'
      - 'web/owner/**'
      - 'protocol/**'
      - 'sdk/typescript/**'
      - 'android/**'
      - '.github/workflows/sealed-interop.yml'
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels that pull request's older run. Every
# push to main gets its own group, so main runs are never canceled or queued.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sealed-interop:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      ZT_AUTH_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
      ZT_DELIVERY_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
      ZT_INBOUND_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
      DATABASE_ALLOW_PLAINTEXT: 'true'
      # Smaller, reusable build artifacts: no incremental churn, symbols only
      # deep enough for line-numbered backtraces.
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - name: Select temporary fixture paths
        run: |
          # The Rust tests write to these fixed, Git-ignored directories in the checkout.
          dir="$GITHUB_WORKSPACE/target/zrotext-sealed-interop"
          echo "ZT_INTEROP_TEST_FIXTURE=$dir/persisted-fixture.json" >> "$GITHUB_ENV"
          echo "ZT_INTEROP_TEST_CONTEXT=$dir/expected-context.json" >> "$GITHUB_ENV"
          boundary="$GITHUB_WORKSPACE/target/zrotext-sealed-boundary"
          echo "ZT_INTEROP_CANARY_FIXTURE=$boundary/canary-fixture.json" >> "$GITHUB_ENV"
          echo "ZT_INTEROP_CANARY_CONTEXT=$boundary/canary-context.json" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Gradle wrapper JAR
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache Gradle distribution and dependencies
        # Open-source GitHub Actions cache provider; only main writes it.
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install existing toolchain versions
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
          rustup target add --toolchain 1.97.1 aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;28.2.13676358'
      - name: Cache Rust build artifacts
        # Dependency cache shared with the CI rust job; PR runs only read it.
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: linux-cargo-deps
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Remove a fixture directory restored from the cache
        # The shared Rust cache can restore target/zrotext-sealed-interop or
        # target/zrotext-sealed-boundary from an earlier run. Both tests refuse
        # an existing directory so they never hand a stale fixture to Android,
        # so clear them here and let every run make new ones.
        run: rm -rf "$GITHUB_WORKSPACE/target/zrotext-sealed-interop" "$GITHUB_WORKSPACE/target/zrotext-sealed-boundary"
      - name: Build and test the SDK
        working-directory: sdk/typescript
        run: npm ci --ignore-scripts && npm test
      - name: Check the explicit cross-client Rust test
        run: |
          cargo fmt --all --check
          cargo clippy --locked -p zrotext-server --all-targets --features sealed-interop-tests -- -D warnings
      - name: Generate ciphertext and exercise PostgreSQL admission
        run: |
          cargo test --locked -p zrotext-server --lib --features sealed-interop-tests cross_client_interop:: -- --ignored --nocapture
          cargo test --locked -p zrotext-server --lib --features sealed-interop-tests sealed_boundary_acceptance:: -- --ignored --nocapture
      - name: Verify and decrypt the database-returned ciphertext
        working-directory: android
        run: ./gradlew --init-script sealed-interop.init.gradle :app:testDebugUnitTest --tests org.zrotext.gateway.SealedSdkPostgresInteropTest --tests org.zrotext.gateway.SealedBoundaryCanaryTest --no-configuration-cache --no-daemon --max-workers=2
      - name: Require every Android case without skips
        run: |
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET
          expected = {
              'android/app/build/test-results/testDebugUnitTest/TEST-org.zrotext.gateway.SealedSdkPostgresInteropTest.xml': ('24', 'cross-client'),
              'android/app/build/test-results/testDebugUnitTest/TEST-org.zrotext.gateway.SealedBoundaryCanaryTest.xml': ('5', 'boundary canary'),
          }
          for path, (count, label) in expected.items():
              result = ET.parse(path).getroot()
              for key, value in {'tests': count, 'failures': '0', 'errors': '0', 'skipped': '0'}.items():
                  if result.get(key) != value:
                      raise SystemExit(f'Unexpected {key} in {label}: {result.get(key)}')
              print(f'All {count} {label} Android cases passed without skips')
          PY
