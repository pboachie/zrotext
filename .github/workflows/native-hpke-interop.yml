name: Native HPKE recipient interop
on:
  pull_request:
    paths: ['sdk/native/hpke-candidate/**', '.github/workflows/native-hpke-interop.yml']
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  interop:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.13.0'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.9'
          cache: false
      - name: Prepare independent reviewed producer
        run: |
          git clone -c core.autocrlf=false --no-checkout https://github.com/pboachie/zrotext.git "$RUNNER_TEMP/producer"
          git -C "$RUNNER_TEMP/producer" checkout --detach 4028720ca2b066ddd964e78b02efa1de01080cf4
          npm ci --prefix "$RUNNER_TEMP/producer/sdk/typescript" --ignore-scripts --no-audit --no-fund
      - name: Prepare reviewed public envelope fixtures
        run: |
          git clone -c core.autocrlf=false --no-checkout https://github.com/pboachie/zrotext.git "$RUNNER_TEMP/envelopes"
          git -C "$RUNNER_TEMP/envelopes" checkout --detach 9ddd579b1965180db4ccfa503cce9c338b970f68
      - name: Prepare maintained TypeScript archive producer
        run: |
          git clone -c core.autocrlf=false --no-checkout https://github.com/pboachie/zrotext.git "$RUNNER_TEMP/archive"
          git -C "$RUNNER_TEMP/archive" checkout --detach 93a65d737dfb0de603c732241c667f90771f60dd
          npm ci --prefix "$RUNNER_TEMP/archive/sdk/typescript" --ignore-scripts --no-audit --no-fund
          npm run build --prefix "$RUNNER_TEMP/archive/sdk/typescript"
      - name: Prepare maintained TypeScript election producer
        run: |
          git clone -c core.autocrlf=false --no-checkout https://github.com/pboachie/zrotext.git "$RUNNER_TEMP/election"
          git -C "$RUNNER_TEMP/election" checkout --detach 304d512b7a420a3102278f32baed095f3e778989
          npm ci --prefix "$RUNNER_TEMP/election/sdk/typescript" --ignore-scripts --no-audit --no-fund
          npm run build --prefix "$RUNNER_TEMP/election/sdk/typescript"
      - run: rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
      - name: Rust native recipient and package
        working-directory: sdk/native/hpke-candidate/rust
        run: |
          cargo +1.97.1 fmt --check
          cargo +1.97.1 clippy --locked --all-targets -- -D warnings
          node "$RUNNER_TEMP/producer/sdk/typescript/test/emit-native-hpke.mjs" | cargo +1.97.1 run --locked --example interop
          python "$RUNNER_TEMP/envelopes/sdk/native/crypto-envelope/java/envelope_rows.py" | cargo +1.97.1 run --locked --example envelope
          cargo +1.97.1 run --locked --example manifest < ../../../../protocol/v1/vectors/sealed-profile03-contract-01.json
          node "$RUNNER_TEMP/archive/sdk/native/sealed-candidate/python/produce-fixture.mjs" | node ../reader-controls.mjs | cargo +1.97.1 run --locked --example reader
          node "$RUNNER_TEMP/election/sdk/native/sealed-candidate/python/produce-election03.mjs" | cargo +1.97.1 run --locked --example election
          node "$RUNNER_TEMP/election/sdk/native/sealed-candidate/python/produce-election03.mjs" | cargo +1.97.1 run --locked --example journal
          cargo +1.97.1 package --locked
      - name: Go native recipient
        working-directory: sdk/native/hpke-candidate/go
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          node "$RUNNER_TEMP/election/sdk/native/sealed-candidate/python/produce-election03.mjs" | go run ./cmd/journal
          node "$RUNNER_TEMP/election/sdk/native/sealed-candidate/python/produce-election03.mjs" | go run ./cmd/election
          node "$RUNNER_TEMP/archive/sdk/native/sealed-candidate/python/produce-fixture.mjs" | node ../reader-controls.mjs | go run ./cmd/reader
          go run ./cmd/manifest < ../../../../protocol/v1/vectors/sealed-profile03-contract-01.json
          python "$RUNNER_TEMP/envelopes/sdk/native/crypto-envelope/java/envelope_rows.py" | go run ./cmd/envelope
          node "$RUNNER_TEMP/producer/sdk/typescript/test/emit-native-hpke.mjs" | go run ./cmd/interop

  windows-protected:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.13.0'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.9'
          cache: false
      - run: rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
      - name: Prepare exact public-point-only producer
        shell: pwsh
        run: |
          git clone -c core.autocrlf=false --no-checkout https://github.com/pboachie/zrotext.git "$env:RUNNER_TEMP/archive"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C "$env:RUNNER_TEMP/archive" checkout --detach 93a65d737dfb0de603c732241c667f90771f60dd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --prefix "$env:RUNNER_TEMP/archive/sdk/typescript" --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build --prefix "$env:RUNNER_TEMP/archive/sdk/typescript"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare exact elected public-point producer
        shell: pwsh
        run: |
          git clone -c core.autocrlf=false --no-checkout https://github.com/pboachie/zrotext.git "$env:RUNNER_TEMP/election"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C "$env:RUNNER_TEMP/election" checkout --detach 304d512b7a420a3102278f32baed095f3e778989
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --prefix "$env:RUNNER_TEMP/election/sdk/typescript" --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build --prefix "$env:RUNNER_TEMP/election/sdk/typescript"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native Windows build and conditional protected qualification
        shell: pwsh
        env:
          RUSTUP_TOOLCHAIN: '1.97.1'
        run: |
          cargo fmt --manifest-path sdk/native/hpke-candidate/rust/Cargo.toml --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --manifest-path sdk/native/hpke-candidate/rust/Cargo.toml --locked --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python sdk/native/hpke-candidate/run-cng.py --producer "$env:RUNNER_TEMP/archive" --language rust
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python sdk/native/hpke-candidate/run-cng.py --producer "$env:RUNNER_TEMP/archive" --language go
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python sdk/native/hpke-candidate/run-cng.py --producer "$env:RUNNER_TEMP/election" --language rust --profile 3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python sdk/native/hpke-candidate/run-cng.py --producer "$env:RUNNER_TEMP/election" --language go --profile 3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
