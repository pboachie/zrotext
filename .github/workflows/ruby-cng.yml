name: Ruby candidate Windows protected recipient
on:
  pull_request:
    paths:
      - 'sdk/native/crypto-envelope/ruby/**'
      - 'sdk/native/crypto-candidate/ruby/**'
      - '.github/workflows/ruby-cng.yml'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  ruby-cng:
    strategy:
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a
        with:
          ruby-version: '3.3.9'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a5fb59c2c5bc81e80b5b8d4b836afd51c5304653
          path: producer
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.13.0'
      - name: Build independent producer
        shell: pwsh
        run: |
          npm ci --prefix producer/sdk/typescript
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build --prefix producer/sdk/typescript
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Qualify native recipient or report capability unavailable
        shell: pwsh
        run: |
          ruby sdk/native/crypto-envelope/ruby/custody/custody_test.rb producer/sdk/native/sealed-candidate/python "$env:RUNNER_TEMP/ruby-cng-pending.txt"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
