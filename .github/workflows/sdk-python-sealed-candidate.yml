name: Python sealed candidate interoperability
on:
  pull_request:
    paths:
      - 'sdk/native/sealed-candidate/python/**'
      - 'sdk/typescript/**'
      - 'protocol/v1/vectors/sealed-profile03-sdk-outbound-01.json'
      - '.github/workflows/sdk-python-sealed-candidate.yml'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  sealed-python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      ZROTEXT_TIME_POLICY_SOURCE: ${{ github.workspace }}/time-policy-source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.13.0'
      - name: Checkout pinned native workflow companion for optional proposal integration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 9c0e969466e2cb8778e03287c7214ba78a50eee1
          path: workflow-source
          persist-credentials: false
      - name: Checkout pinned shared outbound03 time policy fixtures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 3cda99572eafb0dbc2504f88e228f5481234e33f
          path: time-policy-source
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install independent TypeScript producer dependencies
        working-directory: sdk/typescript
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build independent TypeScript producer
        working-directory: sdk/typescript
        run: npm run build
      - name: Install pinned shared fixture dependencies
        working-directory: time-policy-source/sdk/typescript
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build pinned shared fixture implementation
        working-directory: time-policy-source/sdk/typescript
        run: npm run build
      - name: Install native crypto provider
        run: |
          python -m pip install --only-binary=:all: -r sdk/native/sealed-candidate/python/requirements.txt
      - name: Install the exact reviewed optional workflow package
        run: python -m pip install --no-deps workflow-source/sdk/python/workflow
      - name: Execute native cryptographic interoperability and refusal tests
        run: python -m unittest discover -s sdk/native/sealed-candidate/python -p 'test_*.py'
      - name: Build bounded wheel and sdist and exercise isolated installed consumers
        run: python sdk/native/sealed-candidate/python/check_package.py --output native-python-artifacts --workflow-source workflow-source/sdk/python/workflow --time-policy-source time-policy-source
      - name: Preserve tested candidate distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-python-candidate-${{ matrix.os }}
          path: native-python-artifacts/*
          if-no-files-found: error
          retention-days: 7
