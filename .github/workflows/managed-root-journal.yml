name: Managed root transition journals
on:
  pull_request:
    paths:
      - 'sdk/native/crypto-envelope/**'
      - 'sdk/native/crypto-candidate/**'
      - '.github/workflows/managed-root-journal.yml'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  managed-root-journal:
    strategy:
      matrix:
        os: [windows-2025, ubuntu-24.04]
        language: [java, csharp, ruby]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        if: matrix.language == 'java'
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        if: matrix.language == 'csharp'
        with:
          dotnet-version: '8.0.x'
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a
        if: matrix.language == 'ruby'
        with:
          ruby-version: '3.3.9'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 93a65d737dfb0de603c732241c667f90771f60dd
          path: producer
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 26e73753c4ff5e3b27abdca6f5b67ed3ce5a0273
          path: controls
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.13.0'
      - name: Build independent producer and consumer
        shell: pwsh
        run: |
          npm ci --ignore-scripts --prefix producer/sdk/typescript
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build --prefix producer/sdk/typescript
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Exercise root transitions, durable selection and native restored reads
        run: python sdk/native/crypto-envelope/root-journal-run.py --language ${{ matrix.language }} --producer producer --controls controls
