name: CI
on:
  pull_request:
  push:
    branches: [main]
env:
  DOCKER_BUILD_RECORD_UPLOAD: 'false'
permissions:
  contents: read
# A new push to a pull request cancels that pull request's older run. Every
# push to main gets its own group, so main runs are never canceled or queued.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    # Decides whether a pull request can skip the rust or android test steps.
    # The rust and android jobs always run and report success or failure, so
    # the required checks never wait on a skipped job.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pull request merge commit and its first parent, the base tip.
          fetch-depth: 2
          persist-credentials: false
      - name: Select the test suites this change needs
        id: filter
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/ci_changes.py >> "$GITHUB_OUTPUT"
  image-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure the hosted Docker bootstrap cache
        # Keep the canonical Moby reference and its Buildx trust verification.
        # The documented Google cache falls back to Hub when an image is absent.
        run: |
          python3 scripts/ci_docker_mirror.py
          sudo dockerd --validate --config-file "$RUNNER_TEMP/zrotext-docker-daemon.json"
          sudo install -m 600 "$RUNNER_TEMP/zrotext-docker-daemon.json" /etc/docker/daemon.json
          sudo systemctl restart docker
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build server image for vulnerability scan
        # Reuses the cargo-about stage that main stored in the Actions cache.
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/compose/Dockerfile
          load: true
          tags: zrotext-ci-scan:local
          cache-from: type=gha,scope=server-image-cargo-about
      - name: Store the cargo-about stage in the Actions cache
        # Only main writes the cache. The stage is already built, so this step
        # only exports it; the server build layers are never cached.
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/compose/Dockerfile
          target: cargo-about
          cache-to: type=gha,scope=server-image-cargo-about,mode=max
      - name: Report server image and binary sizes
        run: |
          docker image inspect --format 'Image size: {{.Size}} bytes' zrotext-ci-scan:local
          docker run --rm --entrypoint /bin/sh zrotext-ci-scan:local -c 'ls -l /usr/local/bin/'
      - name: Assert billing operator command is bundled
        run: docker run --rm --entrypoint /bin/sh zrotext-ci-scan:local -c 'test -x /usr/local/bin/zrotext-billing-risk-review'
      - name: Scan server image for critical fixable vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: zrotext-ci-scan:local
          format: json
          output: trivy-ci.json
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          version: v0.70.0
      - name: Store image vulnerability report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: server-image-scan-${{ github.run_id }}-${{ github.run_attempt }}
          path: trivy-ci.json
          if-no-files-found: warn
          retention-days: 30
  owner-browser:
    runs-on: ubuntu-24.04
    # Provisioning cannot consume the separate ten-minute acceptance window.
    # The step limits total 29 minutes; retain a bounded outer cleanup margin.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 2
        with:
          node-version: "22.23.4"
      - name: Prepare owner browser dependencies
        timeout-minutes: 5
        run: |
          (cd sdk/typescript && npm ci --ignore-scripts && npm run build)
          (cd web/owner && npm ci --ignore-scripts)
      - name: Install Chromium for rendered owner acceptance
        timeout-minutes: 10
        working-directory: web/owner
        run: npx playwright install --with-deps chromium
      - name: Verify owner flows, rendered layouts and TypeScript reader
        timeout-minutes: 10
        run: |
          node --test web/owner/*.test.js
          (cd web/owner && npm run test:rendered)
          (cd sdk/typescript && npm ci --ignore-scripts && npm test)
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Public-tree hygiene
        run: python3 scripts/check_public_tree.py
      - name: Privacy of every introduced commit
        env:
          PRIVACY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PRIVACY_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/check_public_tree.py --ci
      - name: Hygiene regression tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Test minimal Python client (stdlib only, loopback stub server)
        run: python3 -m unittest discover -s sdk/python/tests -t sdk/python
      - name: Roadmap output matches docs/roadmap.json
        run: python3 scripts/roadmap.py --check
      - name: Stage hash-verified pip for offline interpreter setup
        run: python -I scripts/bootstrap_python_pip.py --fetch-only --wheel-dir "${{ runner.temp }}/python-pip-bootstrap"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        env:
          PIP_CONFIG_FILE: ${{ runner.os == 'Windows' && 'nul' || '/dev/null' }}
          PIP_NO_INDEX: '1'
          PIP_FIND_LINKS: ${{ runner.temp }}/python-pip-bootstrap/pip-26.2.2-py3-none-any.whl
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        with:
          python-version: '3.12.15'
          check-latest: true
      - name: Qualify pip before network package operations
        run: python -I scripts/bootstrap_python_pip.py
      - name: Complete protocol contracts and vectors
        run: |
          python3 -m venv /tmp/zrotext-schema-venv
          /tmp/zrotext-schema-venv/bin/python -I scripts/bootstrap_python_pip.py
          /tmp/zrotext-schema-venv/bin/pip install --disable-pip-version-check jsonschema==4.25.1
          /tmp/zrotext-schema-venv/bin/python -m unittest discover -s protocol/v1/tests -p 'test_*.py'
      - name: JavaScript syntax
        run: node --check web/owner/devices.js
      - name: Commit sign-off
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_CREATED_AT: ${{ github.event.pull_request.created_at }}
          PR_AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_BASE_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check_dco.py
      - name: Spelling
        uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1
  rust-workspace:
    needs: changes
    # Runs even if the change filter failed; its steps then run in full.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: docker.io/library/postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      ZT_AUTH_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
      ZT_DELIVERY_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
      ZT_INBOUND_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
      ZT_REGISTERED_OWNER_EMPTY_DATABASE_URL: postgresql://zt_registered_control@127.0.0.1:5432/zt_registered_empty
      ZT_REGISTERED_OWNER_MFA_DATABASE_URL: postgresql://zt_registered_control@127.0.0.1:5432/zt_registered_mfa
      # Smaller, reusable build artifacts: no incremental churn, symbols only
      # deep enough for line-numbered backtraces.
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      ZT_FAILOVER_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
      RUN_RUST: ${{ needs.changes.outputs.rust != 'false' }}
    steps:
      - name: Skip Rust suites for a change that cannot affect them
        if: env.RUN_RUST != 'true'
        run: echo 'Every changed file is documentation or Android-only; see scripts/ci_changes.py.'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RUN_RUST == 'true'
        with:
          persist-credentials: false
      - name: Check documented environment variables
        if: env.RUN_RUST == 'true'
        run: python3 scripts/check_env_example.py
      - name: Install pinned Rust toolchain
        if: env.RUN_RUST == 'true'
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy --component rustfmt
      - name: Cache Rust build artifacts
        if: env.RUN_RUST == 'true'
        # Dependency cache shared with sealed-interop.yml; PR runs only read it.
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux-cargo-deps
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Verify the native Cargo runner and real doctest boundary
        if: env.RUN_RUST == 'true'
        run: python3 scripts/test_ci_rust_postgresql.py --native-runner-smoke
      - name: Format
        if: env.RUN_RUST == 'true'
        run: cargo fmt --all --check
      - name: Lint
        if: env.RUN_RUST == 'true'
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test without PostgreSQL-backed and live Stripe tests
        if: env.RUN_RUST == 'true'
        run: cargo test --locked --workspace
      - name: Provision PostgreSQL lock capacity for parallel schema fixtures
        if: env.RUN_RUST == 'true'
        env:
          POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          # Four full-schema fixtures can concurrently lock tables, indexes and
          # foreign-key dependencies during DROP SCHEMA CASCADE. Keep all tests
          # and their concurrency; size the disposable server's lock table.
          docker exec "$POSTGRES_SERVICE_ID" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET max_locks_per_transaction = '256'"
          docker restart "$POSTGRES_SERVICE_ID"
          for attempt in {1..30}; do
            if docker exec "$POSTGRES_SERVICE_ID" pg_isready -U postgres; then
              break
            fi
            sleep 1
          done
          docker exec "$POSTGRES_SERVICE_ID" pg_isready -U postgres
          test "$(docker exec "$POSTGRES_SERVICE_ID" psql -U postgres -d postgres -Atc 'SHOW max_locks_per_transaction')" = '256'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.RUN_RUST == 'true'
        with:
          node-version: "22.23.4"
      - name: Build SDK for authenticated recipe service fixtures
        if: env.RUN_RUST == 'true'
        working-directory: sdk/typescript
        run: npm ci --ignore-scripts && npm run build
      - name: Provision isolated registered-owner control databases
        if: env.RUN_RUST == 'true'
        env:
          POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: docker exec -i "$POSTGRES_SERVICE_ID" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < scripts/registered_control_databases.sql
      - name: Test against PostgreSQL
        if: env.RUN_RUST == 'true'
        run: |
          # This graph-fence test needs its own cluster: owner names are part of
          # the signed graph and unrelated transactions must not overlap.
          restore_container_id="$(docker run -d --rm --memory=1g --cpus=2 --pids-limit=128 \
            -e POSTGRES_USER=zrotext -e POSTGRES_DB=postgres -e POSTGRES_HOST_AUTH_METHOD=trust \
            -p 127.0.0.1::5432 docker.io/library/postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c \
            -c max_prepared_transactions=5 -c max_locks_per_transaction=256)"
          trap 'docker rm -f "$restore_container_id" >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if docker exec "$restore_container_id" pg_isready -U zrotext; then break; fi
            sleep 1
          done
          docker exec "$restore_container_id" pg_isready -U zrotext
          test "$(docker exec "$restore_container_id" psql -U zrotext -d postgres -Atc 'SHOW max_prepared_transactions')" = '5'
          restore_port="$(docker port "$restore_container_id" 5432/tcp)"
          restore_port="${restore_port##*:}"
          [[ "$restore_port" =~ ^[0-9]+$ ]]
          export ZT_RESTORE119_TEST_DATABASE_URL="postgresql://zrotext@127.0.0.1:${restore_port}/postgres"
          python3 scripts/ci_rust_postgresql.py run --suite default --lane remaining --receipt "$RUNNER_TEMP/rust-postgresql-remaining/coverage.json"
      - name: Capture authenticated workflow HTTP output canaries
        if: env.RUN_RUST == 'true'
        run: python3 scripts/workflow_log_canaries.py
      - name: Build migrator and simulator with the workspace feature set
        # `cargo run -p` resolves features for one package and rebuilds about
        # fifty dependencies; the workspace build reuses the test build's.
        if: env.RUN_RUST == 'true'
        run: cargo build --locked --workspace --bin zrotext-migrator --bin zrotext-device-sim
      - name: Apply numbered migrations twice
        if: env.RUN_RUST == 'true'
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
        run: |
          target/debug/zrotext-migrator
          target/debug/zrotext-migrator
      - name: Stage hash-verified pip for offline interpreter setup
        if: env.RUN_RUST == 'true'
        run: python -I scripts/bootstrap_python_pip.py --fetch-only --wheel-dir "${{ runner.temp }}/python-pip-bootstrap"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        if: env.RUN_RUST == 'true'
        env:
          PIP_CONFIG_FILE: ${{ runner.os == 'Windows' && 'nul' || '/dev/null' }}
          PIP_NO_INDEX: '1'
          PIP_FIND_LINKS: ${{ runner.temp }}/python-pip-bootstrap/pip-26.2.2-py3-none-any.whl
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        with:
          python-version: '3.12.15'
          check-latest: true
      - name: Qualify pip before network package operations
        if: env.RUN_RUST == 'true'
        run: python -I scripts/bootstrap_python_pip.py
      - name: Verify PostgreSQL TLS and certificate failures
        if: env.RUN_RUST == 'true'
        run: |
          python3 -m venv /tmp/zrotext-postgres-tls-venv
          /tmp/zrotext-postgres-tls-venv/bin/python -I scripts/bootstrap_python_pip.py
          /tmp/zrotext-postgres-tls-venv/bin/pip install --disable-pip-version-check cryptography==46.0.4
          /tmp/zrotext-postgres-tls-venv/bin/python scripts/tests/test_postgres_tls.py
      - name: Simulator timeline
        if: env.RUN_RUST == 'true'
        run: target/debug/zrotext-device-sim
      - name: Preserve complete residual coverage only after every Rust gate passes
        if: env.RUN_RUST == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rust-postgresql-${{ github.run_id }}-${{ github.run_attempt }}-remaining
          path: ${{ runner.temp }}/rust-postgresql-remaining/coverage.json
          if-no-files-found: error
          retention-days: 3
  rust-postgresql:
    needs: changes
    # Runs even if the change filter failed; its steps then run in full.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Five database lanes, at most three at once, plus rust-workspace.
      max-parallel: 3
      matrix:
        lane: [delivery-store, server-0, server-1, server-2, server-3]
    services:
      postgres:
        image: docker.io/library/postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      ZT_AUTH_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
      ZT_DELIVERY_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
      ZT_INBOUND_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
      ZT_REGISTERED_OWNER_EMPTY_DATABASE_URL: postgresql://zt_registered_control@127.0.0.1:5432/zt_registered_empty
      ZT_REGISTERED_OWNER_MFA_DATABASE_URL: postgresql://zt_registered_control@127.0.0.1:5432/zt_registered_mfa
      # Smaller, reusable build artifacts: no incremental churn, symbols only
      # deep enough for line-numbered backtraces.
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      ZT_FAILOVER_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
      RUN_RUST: ${{ needs.changes.outputs.rust != 'false' }}
    steps:
      - name: Skip Rust suites for a change that cannot affect them
        if: env.RUN_RUST != 'true'
        run: echo 'Every changed file is documentation or Android-only; see scripts/ci_changes.py.'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RUN_RUST == 'true'
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        if: env.RUN_RUST == 'true'
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy --component rustfmt
      - name: Cache Rust build artifacts
        if: env.RUN_RUST == 'true'
        # Dependency cache shared with sealed-interop.yml; PR runs only read it.
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux-cargo-deps
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Provision PostgreSQL lock capacity for parallel schema fixtures
        if: env.RUN_RUST == 'true'
        env:
          POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          # Four full-schema fixtures can concurrently lock tables, indexes and
          # foreign-key dependencies during DROP SCHEMA CASCADE. Keep all tests
          # and their concurrency; size the disposable server's lock table.
          docker exec "$POSTGRES_SERVICE_ID" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET max_locks_per_transaction = '256'"
          docker restart "$POSTGRES_SERVICE_ID"
          for attempt in {1..30}; do
            if docker exec "$POSTGRES_SERVICE_ID" pg_isready -U postgres; then
              break
            fi
            sleep 1
          done
          docker exec "$POSTGRES_SERVICE_ID" pg_isready -U postgres
          test "$(docker exec "$POSTGRES_SERVICE_ID" psql -U postgres -d postgres -Atc 'SHOW max_locks_per_transaction')" = '256'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.RUN_RUST == 'true'
        with:
          node-version: "22.23.4"
      - name: Build SDK for authenticated recipe service fixtures
        if: env.RUN_RUST == 'true'
        working-directory: sdk/typescript
        run: npm ci --ignore-scripts && npm run build
      - name: Provision isolated registered-owner control databases
        if: env.RUN_RUST == 'true'
        env:
          POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: docker exec -i "$POSTGRES_SERVICE_ID" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < scripts/registered_control_databases.sql
      - name: Test the complete assigned PostgreSQL lane
        if: env.RUN_RUST == 'true'
        run: python3 scripts/ci_rust_postgresql.py run --suite default --lane '${{ matrix.lane }}' --receipt "$RUNNER_TEMP/rust-postgresql-${{ matrix.lane }}/coverage.json"
      - name: Preserve verified PostgreSQL coverage
        if: env.RUN_RUST == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rust-postgresql-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.lane }}
          path: ${{ runner.temp }}/rust-postgresql-${{ matrix.lane }}/coverage.json
          if-no-files-found: error
          retention-days: 3
  rust:
    # Preserve the required context. A successful residual job alone is not a pass.
    name: rust
    if: ${{ always() }}
    needs: [changes, rust-workspace, rust-postgresql]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI_NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Require successful prerequisites and an explicit filter decision
        id: status
        run: python3 scripts/ci_rust_postgresql.py status --suite default >> "$GITHUB_OUTPUT"
      - name: Install pinned metadata toolchain
        if: steps.status.outputs.run == 'true'
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Download only this invocation's coverage receipts
        if: steps.status.outputs.run == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: rust-postgresql-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/rust-postgresql-coverage
      - name: Require complete disjoint current-source PostgreSQL coverage
        if: steps.status.outputs.run == 'true'
        run: python3 scripts/ci_rust_postgresql.py verify --suite default --receipts "$RUNNER_TEMP/rust-postgresql-coverage"
      - name: Preserve the existing documentation-only no-op
        if: steps.status.outputs.run == 'false'
        run: echo 'The successful change filter explicitly selected no Rust tests; all prerequisites succeeded.'
  android:
    needs: changes
    # Runs even if the change filter failed; its steps then run in full.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    # Allow cold native/Android compilation and one isolated JVM per test class.
    # Keep every lint, unit-test and APK gate within a finite job budget.
    timeout-minutes: 45
    env:
      RUN_ANDROID: ${{ needs.changes.outputs.android != 'false' }}
    steps:
      - name: Skip Android suites for a change that cannot affect them
        if: env.RUN_ANDROID != 'true'
        run: echo 'Every changed file is documentation or server-only; see scripts/ci_changes.py.'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RUN_ANDROID == 'true'
        with:
          persist-credentials: false
      - name: Validate Gradle wrapper JAR
        if: env.RUN_ANDROID == 'true'
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Test Android release and native inventory boundaries
        if: env.RUN_ANDROID == 'true'
        run: python3 -m unittest discover -s android/tools -p 'test_*.py'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: env.RUN_ANDROID == 'true'
        with:
          distribution: temurin
          java-version: '21.0.13+9'
          check-latest: true
      - name: Prepare job-local Java TLS trust
        if: env.RUN_ANDROID == 'true'
        run: python scripts/prepare_java_ci_trust.py --major 21
      - name: Verify patched Java runtime and trust roots
        if: env.RUN_ANDROID == 'true'
        run: python scripts/check_java_toolchain.py --major 21
      - name: Cache Gradle distribution and dependencies
        if: env.RUN_ANDROID == 'true'
        # Open-source GitHub Actions cache provider; only main writes it.
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        if: env.RUN_ANDROID == 'true'
      - name: Install Android SDK platform
        if: env.RUN_ANDROID == 'true'
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Install pinned owner-custody Android Rust targets
        if: env.RUN_ANDROID == 'true'
        run: |
          rustup show active-toolchain
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
      - name: Run wolfSSL cryptocb bridge known-answer tests on the host
        if: env.RUN_ANDROID == 'true'
        # The SOFTWARE-KEY variant of the #1003 bridge KAT (RFC 9180 vector
        # plus cryptocb-only fail-closed proofs) against the exact vendored
        # wolfSSL subset and wrapper the Android app ships. This is an
        # additional lane; the AndroidKeyStore KATs run on the emulator in
        # android-device-smoke.yml.
        run: |
          cmake -S android/app/src/main/cpp -B "$RUNNER_TEMP/zt-hpke-kat" \
            -DZT_HOST_KAT=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/zt-hpke-kat"
          ctest --test-dir "$RUNNER_TEMP/zt-hpke-kat" --output-on-failure
      - name: Lint, test and build debug APK
        if: env.RUN_ANDROID == 'true'
        working-directory: android
        # assembleDebugAndroidTest compiles src/androidTest against the debug APK. It does not
        # run those tests (no device in CI) but it does catch a broken instrumented test file.
        run: ./gradlew :app:lintDebug :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
      - name: Record emulator candidate identity
        if: env.RUN_ANDROID == 'true'
        run: |
          git rev-parse HEAD > candidate-source-commit.txt
          git rev-parse 'HEAD^{tree}' > candidate-source-tree.txt
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk > candidate-apk-SHA256SUMS
      - name: Preserve debug candidate for emulator-only acceptance
        if: env.RUN_ANDROID == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: emulator-debug-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            candidate-source-commit.txt
            candidate-source-tree.txt
            candidate-apk-SHA256SUMS
          if-no-files-found: error
          retention-days: 3
