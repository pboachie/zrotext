name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  owner-browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test owner browser flows
        run: node --test web/owner/*.test.js
  rust:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      ZT_AUTH_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
      ZT_DELIVERY_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
      ZT_INBOUND_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace
      - name: Apply numbered migrations twice
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
        run: |
          cargo run --locked -p zrotext-migrator
          cargo run --locked -p zrotext-migrator
      - name: Simulator timeline
        run: cargo run --locked -p zrotext-device-sim
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install Android SDK platform
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Lint, test and build debug APK
        working-directory: android
        run: ./gradlew :app:lintDebug :app:testDebugUnitTest :app:assembleDebug --no-daemon
