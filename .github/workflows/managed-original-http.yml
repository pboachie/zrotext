name: Managed original-grant HTTPS transport
on:
  pull_request:
    paths:
      - 'sdk/native/crypto-envelope/**'
      - '.github/workflows/managed-original-http.yml'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  managed-original-http:
    strategy:
      matrix:
        os: [windows-2025, ubuntu-24.04]
        language: [java, csharp, ruby]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        if: matrix.language == 'java'
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        if: matrix.language == 'csharp'
        with:
          dotnet-version: '8.0.x'
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a
        if: matrix.language == 'ruby'
        with:
          ruby-version: '3.3.9'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6307413ae33fa4623483ca5adf306045b3efffb1
          path: fixture
          persist-credentials: false
      - name: Install synthetic TLS certificate dependency
        run: python -m pip install cryptography==46.0.5
      - name: Exercise actual TLS requests and bounded failures
        run: python sdk/native/crypto-envelope/original-http-run.py --language ${{ matrix.language }} --fixture fixture
