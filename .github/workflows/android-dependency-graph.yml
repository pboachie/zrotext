name: Android dependency graph
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  gradle-dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Gradle wrapper JAR
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21.0.13+9'
          check-latest: true
      - name: Prepare job-local Java TLS trust
        run: python scripts/prepare_java_ci_trust.py --major 21
      - name: Verify patched Java runtime and trust roots
        run: python scripts/check_java_toolchain.py --major 21
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install Android SDK platform
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Submit resolved Gradle dependencies
        uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          build-root-directory: android
          cache-provider: basic
