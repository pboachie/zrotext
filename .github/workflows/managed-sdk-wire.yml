name: Managed SDK synthetic wire contracts
on:
  pull_request:
    paths:
      - 'sdk/tungsten/**'
      - 'protocol/v1/openapi/**'
      - 'scripts/*tungsten*'
      - '.github/workflows/managed-sdk-wire.yml'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  managed-wire:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out exact runtime and generator source
        shell: bash
        run: |
          revision=$(python3 -c 'import json; print(json.load(open("sdk/tungsten/generator.lock.json"))["revision"])')
          git clone -c core.autocrlf=false --no-checkout https://github.com/pboachie/tungsten.git "$RUNNER_TEMP/tungsten"
          git -C "$RUNNER_TEMP/tungsten" checkout --detach "$revision"
      - name: Reproduce reviewed generated sources
        run: python3 scripts/tungsten_sdk.py --source "$RUNNER_TEMP/tungsten" --check
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.401'
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          ruby-version: '3.3.9'
      - name: Java wire contracts
        run: python3 sdk/tungsten/conformance/managed/run.py --source "$RUNNER_TEMP/tungsten" --target java
      - name: C# wire contracts
        run: python3 sdk/tungsten/conformance/managed/run.py --source "$RUNNER_TEMP/tungsten" --target csharp
      - name: Ruby wire contracts
        run: python3 sdk/tungsten/conformance/managed/run.py --source "$RUNNER_TEMP/tungsten" --target ruby
