name: Consolidated SDK conformance and packaging checks
on:
  pull_request:
    paths:
      - 'sdk/**'
      - 'protocol/**'
      - '.github/workflows/sdk-consolidated.yml'
  push:
    branches: [main]
permissions:
  contents: read
# Supersede only older runs for the same PR. Each main push keeps its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  cng-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.13.0'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: ruby/setup-ruby@b1da4809b005e0178fe08a1d57317bffc00b7b4c
        with:
          ruby-version: '3.3.9'
      - name: "Csharp protected candidate composition: Checkout pinned fixtures"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 304d512b7a420a3102278f32baed095f3e778989
          path: producer
          persist-credentials: false
      - name: "Csharp protected candidate composition: Build independent producer and consumer"
        shell: pwsh
        run: |
          npm ci --prefix producer/sdk/typescript
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build --prefix producer/sdk/typescript
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: "Csharp protected candidate composition: Exercise native signer composition and exact replay"
        shell: pwsh
        run: |
          dotnet run --project sdk/native/crypto-envelope/csharp/composition/ComposeTest.csproj -- producer/sdk/native/sealed-candidate/python "$env:RUNNER_TEMP/csharp-sign-pending.txt"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: "Java candidate Windows protected recipient: Checkout pinned fixtures"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a5fb59c2c5bc81e80b5b8d4b836afd51c5304653
          path: producer
          persist-credentials: false
      - name: "Java candidate Windows protected recipient: Build independent producer"
        shell: pwsh
        run: |
          npm ci --prefix producer/sdk/typescript
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build --prefix producer/sdk/typescript
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: "Java candidate Windows protected recipient: Qualify native recipient or report capability unavailable"
        run: |
          python sdk/native/crypto-envelope/java/custody/run.py --producer producer
      - name: "Java protected candidate composition: Checkout pinned fixtures"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 304d512b7a420a3102278f32baed095f3e778989
          path: producer
          persist-credentials: false
      - name: "Java protected candidate composition: Build independent producer and consumer"
        shell: pwsh
        run: |
          npm ci --prefix producer/sdk/typescript
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build --prefix producer/sdk/typescript
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: "Java protected candidate composition: Exercise native signer composition and exact replay"
        run: |
          python sdk/native/crypto-envelope/java/composition/run.py --producer producer
      - name: "Managed candidate Windows protected recipient: Checkout pinned fixtures"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a5fb59c2c5bc81e80b5b8d4b836afd51c5304653
          path: producer
          persist-credentials: false
      - name: "Managed candidate Windows protected recipient: Build independent producer"
        shell: pwsh
        run: |
          npm ci --prefix producer/sdk/typescript
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build --prefix producer/sdk/typescript
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: "Managed candidate Windows protected recipient: Qualify hardware or report unavailable before creation"
        shell: pwsh
        run: |
          dotnet run --project sdk/native/crypto-envelope/csharp/custody/CustodyTest.csproj -- producer/sdk/native/sealed-candidate/python "$env:RUNNER_TEMP/managed-cng-pending.txt"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: "Ruby candidate Windows protected recipient: Checkout pinned fixtures"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a5fb59c2c5bc81e80b5b8d4b836afd51c5304653
          path: producer
          persist-credentials: false
      - name: "Ruby candidate Windows protected recipient: Build independent producer"
        shell: pwsh
        run: |
          npm ci --prefix producer/sdk/typescript
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build --prefix producer/sdk/typescript
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: "Ruby candidate Windows protected recipient: Qualify native recipient or report capability unavailable"
        shell: pwsh
        run: |
          ruby sdk/native/crypto-envelope/ruby/custody/custody_test.rb producer/sdk/native/sealed-candidate/python "$env:RUNNER_TEMP/ruby-cng-pending.txt"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: "Ruby protected candidate composition: Checkout pinned fixtures"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 304d512b7a420a3102278f32baed095f3e778989
          path: producer
          persist-credentials: false
      - name: "Ruby protected candidate composition: Build independent producer and consumer"
        shell: pwsh
        run: |
          npm ci --prefix producer/sdk/typescript
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build --prefix producer/sdk/typescript
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: "Ruby protected candidate composition: Exercise native signing composition and exact replay"
        shell: pwsh
        run: |
          ruby sdk/native/crypto-envelope/ruby/composition/compose_test.rb producer/sdk/native/sealed-candidate/python "$env:RUNNER_TEMP/ruby-sign-pending.txt"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
  pkg-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.13.0'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.9'
          cache: false
      - name: "Native candidate installed archives: Checkout pinned context_oracle"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8982ee9e96be15801a424708afa603ef708a8a5b
          path: pin-context_oracle
          persist-credentials: false
      - name: "Native candidate installed archives: Build pinned context_oracle producer"
        shell: pwsh
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix pin-context_oracle/sdk/typescript
          npm run build --prefix pin-context_oracle/sdk/typescript
      - name: "Native candidate installed archives [rust]"
        run: |
          rustup toolchain install 1.97.1 --profile minimal
      - name: "Native candidate installed archives [rust]"
        run: |
          python -m pip install cryptography==46.0.5 ada-url==1.27.0
      - name: "Native candidate installed archives [rust]: Prepare independently pinned maintained producers"
        shell: pwsh
        run: |
          $producers = @{
            archive = 'a13ea1e3d6f6db594485c19b36c43fe642e67c7a'
            election = '304d512b7a420a3102278f32baed095f3e778989'
            original = '72124e1a3ff28e782f870eeddbdc33cacf8ca3b4'
            template = '26e876da9f34372d9cf26511993cf633971e0037'
            save_oracle = '5a25bac026bebee5eba20dc6048ddc1c773c41ed'
            opening_oracle = 'c843543f13e3bbd6ac17a260a4b0523f0748324f'
            authoring_oracle = '059556de2fe314ec0d88833a8d3e4d6ee41a8066'
            contact = 'ccf28fe445ba959aa01d99fed6bd9ee3188b749c'
            context = '7e61c5b2461c82a5fbd05e62d06d14e34a0424d6'
          }
          foreach ($name in $producers.Keys) {
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "$env:RUNNER_TEMP/$name"
            git clone -c core.autocrlf=false --no-checkout https://github.com/pboachie/zrotext.git "$env:RUNNER_TEMP/$name"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git -C "$env:RUNNER_TEMP/$name" fetch --no-tags origin $producers[$name]
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git -C "$env:RUNNER_TEMP/$name" checkout --detach $producers[$name]
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            npm ci --prefix "$env:RUNNER_TEMP/$name/sdk/typescript" --ignore-scripts --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            npm run build --prefix "$env:RUNNER_TEMP/$name/sdk/typescript"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: "Native candidate installed archives [rust]: Build licensed archive and exercise installed consumer"
        env:
          RUSTUP_TOOLCHAIN: '1.97.1'
        shell: pwsh
        run: |
          python sdk/native/hpke-candidate/package-test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Explicit caller budget lets post-handshake cases reach their intended
          # phase on cold hosted TLS; the 100ms pre-dispatch refusal is retained.
          python sdk/native/hpke-candidate/package-native.py --language 'rust' --archive "$env:RUNNER_TEMP/archive" --election "$env:RUNNER_TEMP/election" --original "$env:RUNNER_TEMP/original" --template "$env:RUNNER_TEMP/template" --save-oracle "$env:RUNNER_TEMP/save_oracle" --opening-oracle "$env:RUNNER_TEMP/opening_oracle" --authoring-oracle "$env:RUNNER_TEMP/authoring_oracle" --contact "$env:RUNNER_TEMP/contact" --context "$env:RUNNER_TEMP/context" --owner-deadline-case-ms 1000 --output "$env:RUNNER_TEMP/native-package" --context-oracle pin-context_oracle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: "Native candidate installed archives: Checkout pinned context_oracle"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8982ee9e96be15801a424708afa603ef708a8a5b
          path: pin-context_oracle
          persist-credentials: false
      - name: "Native candidate installed archives: Build pinned context_oracle producer"
        shell: pwsh
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix pin-context_oracle/sdk/typescript
          npm run build --prefix pin-context_oracle/sdk/typescript
      - name: "Native candidate installed archives [go]"
        run: |
          rustup toolchain install 1.97.1 --profile minimal
      - name: "Native candidate installed archives [go]"
        run: |
          python -m pip install cryptography==46.0.5 ada-url==1.27.0
      - name: "Native candidate installed archives [go]: Prepare independently pinned maintained producers"
        shell: pwsh
        run: |
          $producers = @{
            archive = 'a13ea1e3d6f6db594485c19b36c43fe642e67c7a'
            election = '304d512b7a420a3102278f32baed095f3e778989'
            original = '72124e1a3ff28e782f870eeddbdc33cacf8ca3b4'
            template = '26e876da9f34372d9cf26511993cf633971e0037'
            save_oracle = '5a25bac026bebee5eba20dc6048ddc1c773c41ed'
            opening_oracle = 'c843543f13e3bbd6ac17a260a4b0523f0748324f'
            authoring_oracle = '059556de2fe314ec0d88833a8d3e4d6ee41a8066'
            contact = 'ccf28fe445ba959aa01d99fed6bd9ee3188b749c'
            context = '7e61c5b2461c82a5fbd05e62d06d14e34a0424d6'
          }
          foreach ($name in $producers.Keys) {
            $target = "native-go-$name"
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "$env:RUNNER_TEMP/$target"
            git init -q "$env:RUNNER_TEMP/$target"
            git -C "$env:RUNNER_TEMP/$target" remote add origin https://github.com/pboachie/zrotext.git
            git -C "$env:RUNNER_TEMP/$target" fetch -q --no-tags origin $producers[$name]
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git -C "$env:RUNNER_TEMP/$target" checkout --detach $producers[$name]
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            npm ci --prefix "$env:RUNNER_TEMP/$target/sdk/typescript" --ignore-scripts --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            npm run build --prefix "$env:RUNNER_TEMP/$target/sdk/typescript"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: "Native candidate installed archives [go]: Build licensed archive and exercise installed consumer"
        env:
          RUSTUP_TOOLCHAIN: '1.97.1'
        shell: pwsh
        run: |
          python sdk/native/hpke-candidate/package-test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Explicit caller budget lets post-handshake cases reach their intended
          # phase on cold hosted TLS; the 100ms pre-dispatch refusal is retained.
          python sdk/native/hpke-candidate/package-native.py --language 'go' --archive "$env:RUNNER_TEMP/native-go-archive" --election "$env:RUNNER_TEMP/native-go-election" --original "$env:RUNNER_TEMP/native-go-original" --template "$env:RUNNER_TEMP/native-go-template" --save-oracle "$env:RUNNER_TEMP/native-go-save_oracle" --opening-oracle "$env:RUNNER_TEMP/native-go-opening_oracle" --authoring-oracle "$env:RUNNER_TEMP/native-go-authoring_oracle" --contact "$env:RUNNER_TEMP/native-go-contact" --context "$env:RUNNER_TEMP/native-go-context" --owner-deadline-case-ms 1000 --output "$env:RUNNER_TEMP/native-package-2" --context-oracle pin-context_oracle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: "Native webhook installed archives [rust]"
        run: |
          rustup toolchain install 1.88.0 --profile minimal
      - name: "Native webhook installed archives [rust]: Fetch exact shared raw-byte vectors"
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "$env:RUNNER_TEMP/vectors"
          git init -q "$env:RUNNER_TEMP/vectors"
          git -C "$env:RUNNER_TEMP/vectors" remote add origin https://github.com/pboachie/zrotext.git
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C "$env:RUNNER_TEMP/vectors" fetch -q --no-tags origin da72e1ecbde5f5c81febf1562f9f33b3ea03101a
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C "$env:RUNNER_TEMP/vectors" checkout --detach da72e1ecbde5f5c81febf1562f9f33b3ea03101a
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: "Native webhook installed archives [rust]: Verify bounded archive through fresh installed consumer"
        env:
          RUSTUP_TOOLCHAIN: '1.88.0'
        shell: pwsh
        run: |
          python sdk/native/package-webhooks-native.py --language 'rust' --vectors "$env:RUNNER_TEMP/vectors" --output "$env:RUNNER_TEMP/webhook-package"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: "Native webhook installed archives [go]"
        run: |
          rustup toolchain install 1.88.0 --profile minimal
      - name: "Native webhook installed archives [go]: Fetch exact shared raw-byte vectors"
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "$env:RUNNER_TEMP/vectors-2"
          git init -q "$env:RUNNER_TEMP/vectors-2"
          git -C "$env:RUNNER_TEMP/vectors-2" remote add origin https://github.com/pboachie/zrotext.git
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C "$env:RUNNER_TEMP/vectors-2" fetch -q --no-tags origin da72e1ecbde5f5c81febf1562f9f33b3ea03101a
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C "$env:RUNNER_TEMP/vectors-2" checkout --detach da72e1ecbde5f5c81febf1562f9f33b3ea03101a
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: "Native webhook installed archives [go]: Verify bounded archive through fresh installed consumer"
        env:
          RUSTUP_TOOLCHAIN: '1.88.0'
        shell: pwsh
        run: |
          $goRoot = Join-Path $env:RUNNER_TEMP 'go1.22.12'
          if (-not (Test-Path (Join-Path $goRoot 'bin\go.exe'))) {
            $url = 'https://go.dev/dl/go1.22.12.windows-amd64.zip'
            $zip = Join-Path $env:RUNNER_TEMP 'go1.22.12.zip'
            Invoke-WebRequest -Uri $url -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP -Force
            Rename-Item -Path (Join-Path $env:RUNNER_TEMP 'go') -NewName 'go1.22.12'
          }
          $env:Path = "$(Join-Path $goRoot 'bin');$env:Path"
          go version
          python sdk/native/package-webhooks-native.py --language 'go' --vectors "$env:RUNNER_TEMP/vectors-2" --output "$env:RUNNER_TEMP/webhook-package-2"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: "Native outbound03 time policy [rust]"
        run: |
          rustup toolchain install 1.97.1 --profile minimal
      - name: "Native outbound03 time policy [rust]: Build pinned shared signed-policy producer"
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "$env:RUNNER_TEMP/time-policy"
          git init -q "$env:RUNNER_TEMP/time-policy"
          git -C "$env:RUNNER_TEMP/time-policy" remote add origin https://github.com/pboachie/zrotext.git
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C "$env:RUNNER_TEMP/time-policy" fetch -q --no-tags origin 3cda99572eafb0dbc2504f88e228f5481234e33f
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C "$env:RUNNER_TEMP/time-policy" checkout --detach 3cda99572eafb0dbc2504f88e228f5481234e33f
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --prefix "$env:RUNNER_TEMP/time-policy/sdk/typescript" --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build --prefix "$env:RUNNER_TEMP/time-policy/sdk/typescript"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: "Native outbound03 time policy [rust]: Conditional actual protected policy qualification"
        env:
          RUSTUP_TOOLCHAIN: '1.97.1'
        shell: pwsh
        run: |
          python sdk/native/hpke-candidate/run-time-policy.py --language 'rust' --producer "$env:RUNNER_TEMP/time-policy"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: "Native outbound03 time policy [rust]: Authenticated reader lifetime acceptance and refusal"
        env:
          RUSTUP_TOOLCHAIN: '1.97.1'
        shell: pwsh
        run: |
          python sdk/native/hpke-candidate/run-time-reader.py --language 'rust' --producer "$env:RUNNER_TEMP/time-policy"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: "Native outbound03 time policy [go]"
        run: |
          rustup toolchain install 1.97.1 --profile minimal
      - name: "Native outbound03 time policy [go]: Build pinned shared signed-policy producer"
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "$env:RUNNER_TEMP/time-policy-2"
          git init -q "$env:RUNNER_TEMP/time-policy-2"
          git -C "$env:RUNNER_TEMP/time-policy-2" remote add origin https://github.com/pboachie/zrotext.git
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C "$env:RUNNER_TEMP/time-policy-2" fetch -q --no-tags origin 3cda99572eafb0dbc2504f88e228f5481234e33f
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C "$env:RUNNER_TEMP/time-policy-2" checkout --detach 3cda99572eafb0dbc2504f88e228f5481234e33f
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --prefix "$env:RUNNER_TEMP/time-policy-2/sdk/typescript" --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build --prefix "$env:RUNNER_TEMP/time-policy-2/sdk/typescript"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: "Native outbound03 time policy [go]: Conditional actual protected policy qualification"
        env:
          RUSTUP_TOOLCHAIN: '1.97.1'
        shell: pwsh
        run: |
          python sdk/native/hpke-candidate/run-time-policy.py --language 'go' --producer "$env:RUNNER_TEMP/time-policy-2"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: "Native outbound03 time policy [go]: Authenticated reader lifetime acceptance and refusal"
        env:
          RUSTUP_TOOLCHAIN: '1.97.1'
        shell: pwsh
        run: |
          python sdk/native/hpke-candidate/run-time-reader.py --language 'go' --producer "$env:RUNNER_TEMP/time-policy-2"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  py-packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.13.0'
      - name: "Python candidate body conformance: Install pinned native crypto provider"
        run: |
          python -m pip install --only-binary=:all: -r sdk/native/crypto-candidate/python/requirements.txt
      - name: "Python candidate body conformance: Verify shared authentication and text corpus"
        run: |
          python -m unittest discover -s sdk/native/crypto-candidate/python -p 'test_*.py'
      - name: "Python sealed candidate interoperability: Checkout pinned native workflow companion for optional proposal integration"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 9c0e969466e2cb8778e03287c7214ba78a50eee1
          path: workflow-source
          persist-credentials: false
      - name: "Python sealed candidate interoperability: Checkout pinned shared outbound03 time policy fixtures"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 3cda99572eafb0dbc2504f88e228f5481234e33f
          path: time-policy-source
          persist-credentials: false
      - name: "Python sealed candidate interoperability: Install independent TypeScript producer dependencies"
        working-directory: sdk/typescript
        run: |
