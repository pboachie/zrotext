  tungsten:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.13.0'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.401'
      - uses: ruby/setup-ruby@b1da4809b005e0178fe08a1d57317bffc00b7b4c
        with:
          ruby-version: '3.3.9'
      - name: "Local Tungsten workflow adapter"
        working-directory: sdk/typescript
        run: |
          npm ci --ignore-scripts --no-audit --no-fund && npm run build
      - name: "Local Tungsten workflow adapter"
        run: |
          node --test sdk/tungsten/mcp/adapter.test.mjs
      - name: "Tungsten migration comparisons: Generate from the locked source"
        shell: bash
        run: |
          revision=$(python3 -c 'import json; print(json.load(open("sdk/tungsten/generator.lock.json"))["revision"])')
          rm -rf "$RUNNER_TEMP/tungsten"
          git clone -c core.autocrlf=false --no-checkout https://github.com/pboachie/tungsten.git "$RUNNER_TEMP/tungsten"
          git -C "$RUNNER_TEMP/tungsten" fetch --no-tags origin "$revision"
          git -C "$RUNNER_TEMP/tungsten" checkout --detach "$revision"
          python3 scripts/tungsten_sdk.py --source "$RUNNER_TEMP/tungsten" --check
      - name: "Tungsten migration comparisons: Build existing TypeScript client"
        working-directory: sdk/typescript
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: "Tungsten migration comparisons: Build generated TypeScript client"
        working-directory: sdk/tungsten/generated/typescript
        run: |
          cp ../../typescript.package-lock.json package-lock.json
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: "Tungsten migration comparisons: Execute TypeScript comparisons"
        run: |
          node --test sdk/tungsten/migration/typescript.test.mjs
      - name: "Tungsten migration comparisons: Install and execute Python comparisons"
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/migration-python"
          "$RUNNER_TEMP/migration-python/bin/python" -m pip install "$RUNNER_TEMP/tungsten/runtimes/python" ./sdk/tungsten/generated/python
          "$RUNNER_TEMP/migration-python/bin/python" sdk/tungsten/migration/test_python.py
      - name: "Tungsten SDK generation: Test generation policy"
        run: |
          python3 -m unittest discover -s scripts -p 'test_tungsten*.py'
      - name: "Tungsten SDK generation: Check out the locked generator"
        shell: bash
        run: |
          revision=$(python3 -c 'import json; print(json.load(open("sdk/tungsten/generator.lock.json"))["revision"])')
          rm -rf "$RUNNER_TEMP/tungsten-2"
          git clone -c core.autocrlf=false --no-checkout https://github.com/pboachie/tungsten.git "$RUNNER_TEMP/tungsten-2"
          git -C "$RUNNER_TEMP/tungsten-2" fetch --no-tags origin "$revision"
          git -C "$RUNNER_TEMP/tungsten-2" checkout --detach "$revision"
      - name: "Tungsten SDK generation: Generate and verify all targets"
        run: |
          python3 scripts/tungsten_sdk.py --source "$RUNNER_TEMP/tungsten-2" --check
      - name: "Tungsten SDK generation: Verify synthetic local mock scenarios"
        run: |
          python3 scripts/tungsten_sdk.py --source "$RUNNER_TEMP/tungsten-2" --mock-check
      - name: "Tungsten SDK generation: Install the locked TypeScript build graph"
        working-directory: sdk/tungsten/generated/typescript
        run: |
          cp ../../typescript.package-lock.json package-lock.json
          npm ci --ignore-scripts --no-audit --no-fund
      - name: "Tungsten SDK generation: Compile and exercise synthetic TypeScript transport"
        working-directory: sdk/tungsten/generated/typescript
        run: |
          npm run build
          node --test ../../contract.test.mjs
      - name: "Tungsten SDK generation: Install the generated Rust minimum toolchain"
        run: |
          rustup toolchain install 1.88.0 --profile minimal
      - name: "Tungsten SDK generation: Compile Rust SDK and CLI and Go against pinned runtime source"
        run: |
          python3 sdk/tungsten/check-rust-go.py --source "$RUNNER_TEMP/tungsten-2"
      - name: "Tungsten SDK generation: Compile Java and C# and load Ruby against pinned runtime source"
        run: |
          python3 sdk/tungsten/check-managed.py --source "$RUNNER_TEMP/tungsten-2" --target java
          python3 sdk/tungsten/check-managed.py --source "$RUNNER_TEMP/tungsten-2" --target csharp
          python3 sdk/tungsten/check-managed.py --source "$RUNNER_TEMP/tungsten-2" --target ruby
      - name: "Tungsten SDK generation: Build and install generated Python wheels in an isolated consumer"
        run: |
          python3 sdk/tungsten/check-python.py --source "$RUNNER_TEMP/tungsten-2"
      - name: "Tungsten SDK generation: Build licensed deterministic source bundles"
        run: |
          python3 sdk/tungsten/package-sources.py --out "$RUNNER_TEMP/zrotext-sdk-sources"
      - name: "Tungsten SDK generation: Build licensed archives and test isolated package consumers"
        run: |
          python3 sdk/tungsten/package-artifacts.py --source "$RUNNER_TEMP/tungsten-2" --target python --out "$RUNNER_TEMP/zrotext-sdk-packages-7/python"
          python3 sdk/tungsten/package-artifacts.py --source "$RUNNER_TEMP/tungsten-2" --target ruby --out "$RUNNER_TEMP/zrotext-sdk-packages-7/ruby"
          python3 sdk/tungsten/package-artifacts.py --source "$RUNNER_TEMP/tungsten-2" --target typescript --out "$RUNNER_TEMP/zrotext-sdk-packages-7/typescript"
          python3 sdk/tungsten/package-artifacts.py --source "$RUNNER_TEMP/tungsten-2" --target java --out "$RUNNER_TEMP/zrotext-sdk-packages-7/java"
          python3 sdk/tungsten/package-artifacts.py --source "$RUNNER_TEMP/tungsten-2" --target csharp --out "$RUNNER_TEMP/zrotext-sdk-packages-7/csharp"
          python3 sdk/tungsten/package-artifacts.py --source "$RUNNER_TEMP/tungsten-2" --target go --out "$RUNNER_TEMP/zrotext-sdk-packages-7/go"
          python3 sdk/tungsten/package-artifacts.py --source "$RUNNER_TEMP/tungsten-2" --target rust --out "$RUNNER_TEMP/zrotext-sdk-packages-7/rust"
      - name: "Tungsten SDK generation: Preserve artifacts"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: experimental-sdk-packages
          path: ${{ runner.temp }}/zrotext-sdk-packages-7
          if-no-files-found: error
          retention-days: 7
      - name: "Tungsten SDK generation: Build guarded MCP archive and exercise installed stdio"
        run: |
          python3 sdk/tungsten/package-mcp.py --out "$RUNNER_TEMP/zrotext-guarded-mcp"
      - name: "Tungsten SDK generation: Preserve artifacts"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: experimental-guarded-mcp
          path: ${{ runner.temp }}/zrotext-guarded-mcp
          if-no-files-found: error
          retention-days: 7
      - name: "Tungsten SDK generation: Preserve artifacts"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: experimental-sdk-sources
          path: ${{ runner.temp }}/zrotext-sdk-sources
          if-no-files-found: error
          retention-days: 7
      - name: "Tungsten SDK generation: Install pinned native browser test dependency"
        run: |
          npm --prefix web/owner ci --ignore-scripts --no-audit --no-fund
          web/owner/node_modules/.bin/playwright install --with-deps chromium firefox webkit
      - name: "Tungsten SDK generation: Build experimental WebMCP archive and exercise installed browser"
        run: |
          python3 sdk/tungsten/package-webmcp.py --out "$RUNNER_TEMP/zrotext-webmcp"
      - name: "Tungsten SDK generation: Preserve artifacts"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: experimental-webmcp
          path: ${{ runner.temp }}/zrotext-webmcp
          if-no-files-found: error
          retention-days: 7
