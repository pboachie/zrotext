name: Jules PR review

on:
  pull_request_target:
    types: [opened, ready_for_review]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: Same-repository pull request number
        required: true
        type: number
      mode:
        description: Review changes or address review comments
        required: true
        type: choice
        options: [review, address]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: jules-pr-${{ github.event.issue.number || github.event.pull_request.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: false

jobs:
  jules:
    # Dependabot-triggered runs cannot use the Actions secret; the trusted
    # scheduled run picks up those same-repository PRs.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Review/comment events run the workflow from the trusted default branch.
      # Never check out or execute PR code with the API key.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Start or collect Jules reviews
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/jules_pr_review.py < "$GITHUB_EVENT_PATH"
