name: Jules PR review

on:
  issue_comment:
    types: [created]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: Same-repository pull request number (not needed for backfill)
        required: false
        type: number
      mode:
        description: Review changes or address review comments (not needed for backfill)
        required: false
        type: choice
        options: [review, address]
      backfill:
        description: One-time rollout scan that labels in-flight sessions
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  # All scheduled collectors share a group so overlapping polls cannot send
  # duplicate recovery replies. Preserve per-PR queues for owner requests.
  group: jules-pr-${{ github.event.issue.number || github.event.pull_request.number || inputs.pr_number || 'collector' }}
  cancel-in-progress: false

jobs:
  jules:
    # Reviews are opt-in: only an owner comment command, an explicit dispatch,
    # or the scheduled collector starts a session. Comment events from other
    # accounts never start the job that holds the secret; the script repeats
    # these checks.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'issue_comment' ||
       (github.event.issue.pull_request && github.event.comment.user.login == 'pboachie'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Review/comment events run the workflow from the trusted default branch.
      # Never check out or execute PR code with the API key.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Start or collect Jules reviews
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/jules_pr_review.py < "$GITHUB_EVENT_PATH"
