name: Android unsigned candidate (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
  attestations: write
concurrency:
  group: android-release-candidate
  cancel-in-progress: false
jobs:
  candidate:
    # Signing secrets never run against a PR or a manually selected feature branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install Android SDK platform and APK inspection tools
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
          echo "$ANDROID_HOME/build-tools/37.0.0" >> "$GITHUB_PATH"
      - name: Test release boundary
        run: python3 -m unittest discover -s android/tools -p 'test_*.py'
      - name: Build unsigned candidate without signing secrets
        run: python3 android/tools/release_candidate.py build
      - name: Attest release runtime SBOM for the exact unsigned APK
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: /tmp/zrotext-android-release/unsigned/unsigned.apk
          sbom-path: /tmp/zrotext-android-release/unsigned/release-runtime.cdx.json
      - name: Verify unsigned APK, receipt and SBOM attestation before upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 android/tools/release_candidate.py verify-unsigned
      # Actions artifacts from this public repository are publicly readable.
      # Keep signing keys and signed candidates in an approved private channel.
      - name: Store unsigned candidate for manual review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-unsigned-candidate-${{ github.sha }}
          path: /tmp/zrotext-android-release/unsigned/
          if-no-files-found: error
          retention-days: 7
