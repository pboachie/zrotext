name: Native verified original HTTPS read
on:
  pull_request:
    paths: ['sdk/native/hpke-candidate/**', '.github/workflows/native-reply-read.yml']
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verified-read:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        language: [rust, go]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography==46.0.4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.9'
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.13.0'
      - run: rustup toolchain install 1.97.1 --profile minimal
      - name: Prepare pinned signed fixture producer
        shell: pwsh
        run: |
          git clone -c core.autocrlf=false --no-checkout https://github.com/pboachie/zrotext.git "$env:RUNNER_TEMP/selected"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C "$env:RUNNER_TEMP/selected" checkout --detach 72124e1a3ff28e782f870eeddbdc33cacf8ca3b4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --prefix "$env:RUNNER_TEMP/selected/sdk/typescript" --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build --prefix "$env:RUNNER_TEMP/selected/sdk/typescript"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build native verified read probe
        shell: pwsh
        env:
          RUSTUP_TOOLCHAIN: '1.97.1'
        run: |
          if ('${{ matrix.language }}' -eq 'rust') {
            cargo build --locked --manifest-path sdk/native/hpke-candidate/rust/Cargo.toml --example reply_read
          } else {
            Push-Location sdk/native/hpke-candidate/go
            $probe = "$env:RUNNER_TEMP/reply-read"
            if ($IsWindows) { $probe += '.exe' }
            go build -o $probe ./cmd/reply-read
            Pop-Location
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Signed ciphertext and final durable current proof
        shell: pwsh
        run: |
          $probe = "$env:RUNNER_TEMP/reply-read"
          if ($IsWindows) { $probe += '.exe' }
          if ('${{ matrix.language }}' -eq 'rust') {
            $probe = 'sdk/native/hpke-candidate/rust/target/debug/examples/reply_read'
            if ($IsWindows) { $probe += '.exe' }
          }
          python sdk/native/hpke-candidate/test-original-read.py --binary $probe --producer "$env:RUNNER_TEMP/selected"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
