name: Ruby protected candidate composition
on:
  pull_request:
    paths:
      - 'sdk/native/crypto-envelope/ruby/**'
      - 'sdk/native/crypto-candidate/ruby/**'
      - '.github/workflows/ruby-protected-compose.yml'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  ruby-protected-compose:
    strategy:
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a
        with:
          ruby-version: '3.3.9'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 304d512b7a420a3102278f32baed095f3e778989
          path: producer
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.13.0'
      - name: Build independent producer and consumer
        shell: pwsh
        run: |
          npm ci --prefix producer/sdk/typescript
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build --prefix producer/sdk/typescript
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Exercise native signing composition and exact replay
        shell: pwsh
        run: |
          ruby sdk/native/crypto-envelope/ruby/composition/compose_test.rb producer/sdk/native/sealed-candidate/python "$env:RUNNER_TEMP/ruby-sign-pending.txt"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
