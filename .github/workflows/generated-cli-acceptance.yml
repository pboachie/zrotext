name: Generated Rust CLI acceptance
on:
  pull_request:
    paths: ['sdk/tungsten/cli-acceptance/**', '.github/workflows/generated-cli-acceptance.yml']
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  cli:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check out reviewed foundation and runtime sources
        shell: bash
        run: |
          foundation=$(python3 -c 'import json; print(json.load(open("sdk/tungsten/cli-acceptance/dependency.json"))["foundation_revision"])')
          runtime=$(python3 -c 'import json; print(json.load(open("sdk/tungsten/cli-acceptance/dependency.json"))["runtime_revision"])')
          git clone -c core.autocrlf=false --no-checkout https://github.com/pboachie/zrotext.git "$RUNNER_TEMP/foundation"
          git -C "$RUNNER_TEMP/foundation" checkout --detach "$foundation"
          git clone -c core.autocrlf=false --no-checkout https://github.com/pboachie/tungsten.git "$RUNNER_TEMP/tungsten"
          git -C "$RUNNER_TEMP/tungsten" checkout --detach "$runtime"
      - name: Generate reviewed artifacts
        run: python3 "$RUNNER_TEMP/foundation/scripts/tungsten_sdk.py" --source "$RUNNER_TEMP/tungsten" --check
      - name: Install CLI minimum compiler
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Build and exercise CLI against synthetic loopback HTTP
        run: python3 sdk/tungsten/cli-acceptance/run.py --foundation "$RUNNER_TEMP/foundation" --source "$RUNNER_TEMP/tungsten"
