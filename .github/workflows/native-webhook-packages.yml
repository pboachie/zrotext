name: Native webhook installed archives
on:
  pull_request:
    paths: ['sdk/native/rust/**', 'sdk/native/go/**', 'sdk/native/package-webhooks-native.py', '.github/workflows/native-webhook-packages.yml']
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  installed-webhook:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        language: [rust, go]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.22.12'
          cache: false
      - run: rustup toolchain install 1.88.0 --profile minimal
      - name: Fetch exact shared raw-byte vectors
        shell: pwsh
        run: |
          git clone -c core.autocrlf=false --no-checkout https://github.com/pboachie/zrotext.git "$env:RUNNER_TEMP/vectors"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C "$env:RUNNER_TEMP/vectors" checkout --detach da72e1ecbde5f5c81febf1562f9f33b3ea03101a
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify bounded archive through fresh installed consumer
        shell: pwsh
        env:
          RUSTUP_TOOLCHAIN: '1.88.0'
        run: |
          python sdk/native/package-webhooks-native.py --language '${{ matrix.language }}' --vectors "$env:RUNNER_TEMP/vectors" --output "$env:RUNNER_TEMP/webhook-package"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
