name: Conversation simulator contracts

on:
  pull_request:
    # Not a required check. Main runs it for every push; a pull request runs it
    # only when a file the cross-client build or tests read changes.
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'deploy/compose/migrations/**'
      - 'web/owner/**'
      - 'protocol/**'
      - 'sdk/typescript/**'
      - 'android/**'
      - 'scripts/conversation_simulator.py'
      - '.github/workflows/conversation-simulator.yml'
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels that pull request's older run. Every
# push to main gets its own group, so main runs are never canceled or queued.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  conversation-simulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      ZT_AUTH_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
      ZT_DELIVERY_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
      ZT_INBOUND_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
      DATABASE_ALLOW_PLAINTEXT: 'true'
      # Smaller, reusable build artifacts: no incremental churn, symbols only
      # deep enough for line-numbered backtraces.
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Gradle wrapper JAR
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache Gradle distribution and dependencies
        # Open-source GitHub Actions cache provider; only main writes it.
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install existing toolchain versions
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Cache Rust build artifacts
        # Dependency cache shared with the CI rust job; PR runs only read it.
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: linux-cargo-deps
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the existing SDK and simulator test binaries
        run: |
          (cd sdk/typescript && npm ci --ignore-scripts && npm run build)
          cargo fmt --all --check
          cargo clippy --locked -p zrotext-server --all-targets --features conversation-simulator-tests -- -D warnings
          cargo test --locked -p zrotext-server --lib --features conversation-simulator-tests --no-run
          (cd android && ./gradlew :app:compileDebugUnitTestKotlin --no-daemon --max-workers=2)
      - name: Require synthetic capture, encrypted history, confirmed reply and closure
        run: python3 scripts/conversation_simulator.py
