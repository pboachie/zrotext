name: Conversation simulator contracts

on:
  pull_request:
    # Not a required check. Main runs it for every push; a pull request runs it
    # only when a file the cross-client build or tests read changes.
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'deploy/compose/migrations/**'
      - 'web/owner/**'
      - 'protocol/**'
      - 'sdk/typescript/**'
      - 'android/**'
      - 'scripts/conversation_simulator.py'
      - 'scripts/sealed_setup_ci.py'
      - 'scripts/sealed_setup_ci_driver.mjs'
      - 'scripts/test_sealed_setup_ci.py'
      - 'scripts/package_conversation_browser.mjs'
      - '.github/workflows/conversation-simulator.yml'
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels that pull request's older run. Every
# push to main gets its own group, so main runs are never canceled or queued.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  conversation-simulator:
    runs-on: ubuntu-24.04
    # Full workspace validation and both integration paths must finish; retain
    # every test and its own timeout inside this bounded hosted job budget.
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      ZT_AUTH_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
      ZT_DELIVERY_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
      ZT_INBOUND_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
      ZT_FAILOVER_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
      DATABASE_ALLOW_PLAINTEXT: 'true'
      # Smaller, reusable build artifacts: no incremental churn, symbols only
      # deep enough for line-numbered backtraces.
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Gradle wrapper JAR
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache Gradle distribution and dependencies
        # Open-source GitHub Actions cache provider; only main writes it.
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install existing toolchain versions
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Cache Rust build artifacts
        # Dependency cache shared with the CI rust job; PR runs only read it.
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: linux-cargo-deps
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the existing SDK and simulator test binaries
        run: |
          (cd sdk/typescript && npm ci --ignore-scripts && npm run build)
          cargo fmt --all --check
          cargo clippy --locked -p zrotext-server --all-targets --features conversation-simulator-tests -- -D warnings
          cargo test --locked -p zrotext-server --lib --features conversation-simulator-tests --no-run
      - name: Provision PostgreSQL lock capacity for parallel schema fixtures
        env:
          POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          # Four full-schema fixtures can concurrently lock tables, indexes and
          # foreign-key dependencies during DROP SCHEMA CASCADE. Keep all tests
          # and their concurrency; size the disposable server's lock table.
          docker exec "$POSTGRES_SERVICE_ID" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET max_locks_per_transaction = '256'"
          docker restart "$POSTGRES_SERVICE_ID"
          for attempt in {1..30}; do
            if docker exec "$POSTGRES_SERVICE_ID" pg_isready -U postgres; then
              break
            fi
            sleep 1
          done
          docker exec "$POSTGRES_SERVICE_ID" pg_isready -U postgres
          test "$(docker exec "$POSTGRES_SERVICE_ID" psql -U postgres -d postgres -Atc 'SHOW max_locks_per_transaction')" = '256'
      - name: Validate the complete simulator-enabled workspace
        # The journal bridge runs in the separate compiled-emulator workflow.
        # External Stripe tests require credentials and stay off.
        run: |
          cargo test --locked --workspace --features conversation-simulator-tests
          # This external fixture is driven explicitly by sealed-setup-consumer below.
          cargo test --locked --workspace --features conversation-simulator-tests -- --ignored --skip real_stripe_ --skip loopback_journal_bridge --skip ordinary_setup_server_browser_fixture --test-threads=4
      - name: Build the Android simulator contract tests
        run: (cd android && ./gradlew :app:compileDebugUnitTestKotlin --no-daemon --max-workers=2)
      - name: Require synthetic capture, encrypted history, confirmed reply and closure
        run: python3 scripts/conversation_simulator.py
      - name: Require authenticated dormant runtime assembly
        run: python3 scripts/conversation_simulator.py --assembly

  sealed-setup-consumer:
    # The existing offline CLI uses real Windows console/session protections.
    # Do not replace that boundary with a Linux or JavaScript fixture signer.
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Restore existing Windows dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: windows-cargo-deps
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install pinned fixture tools and build the existing SDK
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Toolchain setup failed' }
          npm ci --prefix sdk/typescript --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw 'SDK install failed' }
          npm run build --prefix sdk/typescript
          if ($LASTEXITCODE -ne 0) { throw 'SDK build failed' }
          npm install --prefix "$env:RUNNER_TEMP/conversation-browser-tools" --no-save --ignore-scripts playwright@1.58.2
          if ($LASTEXITCODE -ne 0) { throw 'Browser tooling setup failed' }
          node "$env:RUNNER_TEMP/conversation-browser-tools/node_modules/playwright/cli.js" install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Browser installation failed' }
          python -m venv "$env:RUNNER_TEMP/sealed-setup-python"
          if ($LASTEXITCODE -ne 0) { throw 'Fixture Python setup failed' }
          & "$env:RUNNER_TEMP/sealed-setup-python/Scripts/python.exe" -m pip install --disable-pip-version-check cryptography==46.0.4
          if ($LASTEXITCODE -ne 0) { throw 'Fixture TLS tooling setup failed' }
      - name: Verify explicit consumer guards
        run: |
          python -m unittest discover -s scripts -p test_sealed_setup_ci.py
          if ($LASTEXITCODE -ne 0) { throw 'PostgreSQL ownership guards failed' }
          node --test sdk/typescript/test/sealed-setup-ci-driver.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Consumer transport guards failed' }
      - name: Inspect fresh fixture ownership without identifiers
        timeout-minutes: 2
        # Read-only metadata from an empty leaf created identically to the fixture.
        # No ACL, owner, token, account or privilege changes are performed.
        run: |
          $leaf = & "$env:RUNNER_TEMP/sealed-setup-python/Scripts/python.exe" -c "import sys,tempfile; sys.path.insert(0,'scripts'); from sealed_setup_ci import owned_fixture_parent; print(tempfile.mkdtemp(prefix='sealed-setup-ci-acl-',dir=owned_fixture_parent()))" 2>$null
          if ($LASTEXITCODE -ne 0) { throw 'Owned metadata fixture creation failed' }
          $parent = [IO.Path]::GetFullPath('target/sealed-setup-postgres-fixtures')
          $leaf = [IO.Path]::GetFullPath($leaf)
          if ([IO.Path]::GetDirectoryName($leaf) -ne $parent -or -not [IO.Path]::GetFileName($leaf).StartsWith('sealed-setup-ci-acl-')) { throw 'Owned metadata fixture fence failed' }
          try {
            if ((Get-Item -LiteralPath $leaf -ErrorAction Stop).Attributes -band [IO.FileAttributes]::ReparsePoint) { throw 'Linked metadata fixture refused' }
            $acl = Get-Acl -LiteralPath $leaf -ErrorAction Stop
            $current = [Security.Principal.WindowsIdentity]::GetCurrent().User
            $owner = $acl.GetOwner([Security.Principal.SecurityIdentifier])
            $admins = [Security.Principal.SecurityIdentifier]::new([Security.Principal.WellKnownSidType]::BuiltinAdministratorsSid, $null)
            $ownerRights = [Security.Principal.SecurityIdentifier]::new('S-1-3-4')
            $directAllow = $false
            $ownerRightsAllow = $false
            foreach ($rule in $acl.GetAccessRules($true, $true, [Security.Principal.SecurityIdentifier])) {
              if ($rule.AccessControlType -ne [Security.AccessControl.AccessControlType]::Allow -or ($rule.PropagationFlags -band [Security.AccessControl.PropagationFlags]::InheritOnly)) { continue }
              if ($rule.IdentityReference.Equals($current)) { $directAllow = $true }
              if ($rule.IdentityReference.Equals($ownerRights)) { $ownerRightsAllow = $true }
            }
            [ordered]@{ version=1; ownerIsCurrentUser=$owner.Equals($current); ownerIsAdministrators=$owner.Equals($admins); directCurrentUserAllow=$directAllow; ownerRightsAllow=$ownerRightsAllow } | ConvertTo-Json -Compress
          } catch { throw 'Owned fixture metadata inspection failed; identifiers withheld' }
          finally {
            try {
              if ((Get-ChildItem -LiteralPath $leaf -Force -ErrorAction Stop).Count -ne 0) { throw 'Owned metadata fixture is not empty' }
              Remove-Item -LiteralPath $leaf -ErrorAction Stop
            } catch { throw 'Owned metadata fixture cleanup unconfirmed; identifiers withheld' }
          }
      - name: Require real compiled server, browser and protected native setup fixtures
        # Initializes and stops ONLY a new RUNNER_TEMP cluster using installed PG17.
        # No existing service, runner database/password, user credentials or SMS.
        run: |
          & "$env:RUNNER_TEMP/sealed-setup-python/Scripts/python.exe" scripts/sealed_setup_ci.py --tools "$env:RUNNER_TEMP/conversation-browser-tools" --pg-bin "$env:ProgramFiles/PostgreSQL/17/bin"
          if ($LASTEXITCODE -ne 0) { throw 'Compiled setup consumer failed' }
