name: Managed candidate profile03 election proofs
on:
  pull_request:
    paths:
      - 'sdk/native/crypto-envelope/java/**'
      - 'sdk/native/crypto-envelope/csharp/**'
      - 'sdk/native/crypto-envelope/ruby/**'
      - 'sdk/native/crypto-candidate/**'
      - '.github/workflows/managed-election.yml'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  managed-election:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '8.0.x'
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          ruby-version: '3.3.9'
      - name: Check out independent maintained producer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: a5fb59c2c5bc81e80b5b8d4b836afd51c5304653
          path: producer
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.13.0'
      - name: Build independent producer and emit temporary fixture
        run: |
          npm ci --prefix producer/sdk/typescript
          npm run build --prefix producer/sdk/typescript
          node producer/sdk/native/sealed-candidate/python/produce-election03.mjs | python3 sdk/native/crypto-envelope/java/election_rows.py > "$RUNNER_TEMP/elections.tsv"
      - name: Java native election verifier
        run: |
          javac --release 17 -Xlint:all -Werror -d "$RUNNER_TEMP/election-classes" sdk/native/crypto-envelope/java/*.java
          java -cp "$RUNNER_TEMP/election-classes" org.zrotext.candidate.ElectionTest < "$RUNNER_TEMP/elections.tsv"
      - name: C# native election verifier
        run: dotnet run --project sdk/native/crypto-envelope/csharp/election-tests/ElectionTest.csproj < "$RUNNER_TEMP/elections.tsv"
      - name: Ruby native election verifier
        run: ruby sdk/native/crypto-envelope/ruby/election_test.rb < "$RUNNER_TEMP/elections.tsv"
