name: Release tag validation
on:
  push:
    tags:
      - '*'
permissions:
  contents: read
jobs:
  release-tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate tag and source commit
        run: python3 scripts/check_release_tag.py
