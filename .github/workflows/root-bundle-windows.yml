name: Root bundle Windows
on:
  pull_request:
    # Not a required check. Main runs it for every push; a pull request runs it
    # only when the Windows crates, their workspace dependencies, the shared
    # vectors they test against, or the native CI harness change.
    paths:
      - 'crates/root-bundle/**'
      - 'crates/root-terminal/**'
      - 'crates/owner-cli/**'
      - 'crates/root-material/**'
      - 'crates/*/Cargo.toml'
      - 'protocol/v1/vectors/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'scripts/windows_native_ci.ps1'
      - 'scripts/windows_native_ci.cs'
      - '.github/workflows/root-bundle-windows.yml'
  push:
    branches: [main]
permissions:
  contents: read
# A new push to a pull request cancels that pull request's older run. Every
# push to main gets its own group, so main runs are never canceled or queued.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  native-bundle:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      # Smaller, reusable build artifacts: no incremental churn, symbols only
      # deep enough for line-numbered backtraces.
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache Rust build artifacts
        # Windows dependency cache; PR runs only read it. The restore step
        # invokes rustc, which installs the pinned toolchain from
        # rust-toolchain.toml before any lint runs.
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: windows-cargo-deps
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint native bundle adapter
        run: cargo clippy --locked -p zrotext-root-bundle --all-targets -- -D warnings
      - name: Lint bounded console transport
        run: cargo clippy --locked -p zrotext-root-terminal --all-targets -- -D warnings
      - name: Lint offline owner commands
        run: cargo clippy --locked -p zrotext-owner --all-targets -- -D warnings
      - name: Verify disposable native fixture guards
        run: ./scripts/windows_native_ci.ps1 -SelfTest
      - name: Exercise the bundle suite as a disposable standard user
        run: ./scripts/windows_native_ci.ps1 -ProvisionEphemeralGithubHostedAccount
      - name: Exercise console and owner suites with reduced-rights children
        run: ./scripts/windows_native_ci.ps1 -ReducedRightsSuites
