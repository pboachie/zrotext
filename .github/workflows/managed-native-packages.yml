name: Managed native candidate packages
on:
  pull_request:
    paths:
      - 'sdk/native/crypto-envelope/**'
      - 'sdk/native/crypto-candidate/**'
      - '.github/workflows/managed-native-packages.yml'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  installed:
    strategy:
      matrix:
        os: [windows-2025, ubuntu-24.04]
        language: [java, csharp, ruby]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        if: matrix.language == 'java'
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        if: matrix.language == 'csharp'
        with:
          dotnet-version: '8.0.x'
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a
        if: matrix.language == 'ruby'
        with:
          ruby-version: '3.3.9'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.13.0'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a13ea1e3d6f6db594485c19b36c43fe642e67c7a
          path: producer02
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 304d512b7a420a3102278f32baed095f3e778989
          path: producer03
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a5fb59c2c5bc81e80b5b8d4b836afd51c5304653
          path: custody-producer
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 93a65d737dfb0de603c732241c667f90771f60dd
          path: root-producer
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 26e73753c4ff5e3b27abdca6f5b67ed3ce5a0273
          path: root-controls
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1b7732ec36bf705f78e69a2cea95b792f04dc772
          path: controls
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 72124e1a3ff28e782f870eeddbdc33cacf8ca3b4
          path: original-producer
          persist-credentials: false
      - name: Build independent producers
        shell: pwsh
        run: |
          foreach ($path in @('producer02','producer03','custody-producer','root-producer','original-producer')) {
            npm ci --ignore-scripts --prefix "$path/sdk/typescript"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            npm run build --prefix "$path/sdk/typescript"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Reject unexpected archive payloads
        run: python sdk/native/crypto-envelope/package-managed-test.py
      - name: Qualify clean installed candidate consumers
        shell: pwsh
        run: |
          python sdk/native/crypto-envelope/package-managed.py --target ${{ matrix.language }} --out "$env:RUNNER_TEMP/native-artifacts" --producer02 producer02 --producer03 producer03 --custody-producer custody-producer --root-producer root-producer --root-controls root-controls --controls controls --original-producer original-producer
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
