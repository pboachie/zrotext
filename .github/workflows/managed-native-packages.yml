name: Managed native candidate packages
on:
  pull_request:
    paths:
      - 'sdk/native/crypto-envelope/**'
      - 'sdk/native/crypto-candidate/**'
      - '.github/workflows/managed-native-packages.yml'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  installed:
    strategy:
      matrix:
        os: [windows-2025, ubuntu-24.04]
        language: [java, csharp, ruby]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        if: matrix.language == 'java'
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        if: matrix.language == 'csharp'
        with:
          dotnet-version: '8.0.x'
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a
        if: matrix.language == 'ruby'
        with:
          ruby-version: '3.3.9'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.13.0'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a13ea1e3d6f6db594485c19b36c43fe642e67c7a
          path: producer02
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 304d512b7a420a3102278f32baed095f3e778989
          path: producer03
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a5fb59c2c5bc81e80b5b8d4b836afd51c5304653
          path: custody-producer
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 93a65d737dfb0de603c732241c667f90771f60dd
          path: root-producer
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 26e73753c4ff5e3b27abdca6f5b67ed3ce5a0273
          path: root-controls
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1b7732ec36bf705f78e69a2cea95b792f04dc772
          path: controls
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 72124e1a3ff28e782f870eeddbdc33cacf8ca3b4
          path: original-producer
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6307413ae33fa4623483ca5adf306045b3efffb1
          path: http-fixture
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 50c7258eb7e616ba8f0574d167bff7b999a9bd8d
          path: current-fixture
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d127e5c86f3b17db371acc608eedcf6419264ba7
          path: read-fixture
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e3ed703a2c5eb0f72fc4138fade0859637dff3d5
          path: page-fixture
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a0cd1763406b6c0a05f7ea57a897664f39667b75
          path: owner-fixture
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a32ef83ad24746a99b3ba8895170b588b718e236
          path: proposal-fixture
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 5d6d683a78461ccb1782014989cb5e4a3f2927f2
          path: template-fixture
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 26e876da9f34372d9cf26511993cf633971e0037
          path: template-producer
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 312e1e0ddfeee21a8af6f75d8c268c7e8346838f
          path: owner-template-fixture
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c98dc2ffc3ab77b74295b9057807e5b51bc17a76
          path: template-save-fixture
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 5a25bac026bebee5eba20dc6048ddc1c773c41ed
          path: template-save-oracle
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c059e5cfc83ec889cfc183b52767fe10735a02af
          path: template-opening-fixture
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c843543f13e3bbd6ac17a260a4b0523f0748324f
          path: template-opening-oracle
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b784cb6a23564a6eb7ac16cbf57134d95b8b2313
          path: template-authoring-fixture
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 059556de2fe314ec0d88833a8d3e4d6ee41a8066
          path: template-authoring-oracle
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 62a00c790ef7537b92f196e9de44a94debbb088f
          path: contact-fixture
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ccf28fe445ba959aa01d99fed6bd9ee3188b749c
          path: contact-producer
          persist-credentials: false
      - name: Build independent producers
        shell: pwsh
        run: |
          foreach ($path in @('producer02','producer03','custody-producer','root-producer','original-producer','template-producer','template-save-oracle','template-opening-oracle','template-authoring-oracle','contact-producer')) {
            npm ci --ignore-scripts --prefix "$path/sdk/typescript"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            npm run build --prefix "$path/sdk/typescript"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Reject unexpected archive payloads
        run: python sdk/native/crypto-envelope/package-managed-test.py
      - name: Install synthetic TLS certificate dependency
        run: python -m pip install cryptography==46.0.5 ada-url==1.27.0
      - name: Build licensed origin asset on Linux
        if: runner.os == 'Linux'
        run: python sdk/native/crypto-envelope/contact-origin/build.py --out "$RUNNER_TEMP/contact-origin"
      - name: Build licensed origin asset on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'C++ compiler unavailable' }
          $batch = Join-Path $env:RUNNER_TEMP 'contact-origin-build.cmd'
          @"
          @call "$vs/VC/Auxiliary/Build/vcvars64.bat"
          @if errorlevel 1 exit /b 1
          @python sdk/native/crypto-envelope/contact-origin/build.py --out "$env:RUNNER_TEMP/contact-origin"
          "@ | Set-Content -LiteralPath $batch
          & cmd /c $batch
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Qualify clean installed candidate consumers
        shell: pwsh
        run: |
          python sdk/native/crypto-envelope/package-managed.py --target ${{ matrix.language }} --out "$env:RUNNER_TEMP/native-artifacts" --producer02 producer02 --producer03 producer03 --custody-producer custody-producer --root-producer root-producer --root-controls root-controls --controls controls --original-producer original-producer --http-fixture http-fixture --current-fixture current-fixture --read-fixture read-fixture --page-fixture page-fixture --owner-fixture owner-fixture --proposal-fixture proposal-fixture --template-fixture template-fixture --template-producer template-producer --owner-template-fixture owner-template-fixture --template-save-fixture template-save-fixture --template-save-oracle template-save-oracle --template-opening-fixture template-opening-fixture --template-opening-oracle template-opening-oracle --template-authoring-fixture template-authoring-fixture --template-authoring-oracle template-authoring-oracle --contact-fixture contact-fixture --contact-producer contact-producer --origin-asset "$env:RUNNER_TEMP/contact-origin"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
