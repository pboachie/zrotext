name: Managed candidate profile02 readers
on:
  pull_request:
    paths:
      - 'sdk/native/crypto-envelope/java/**'
      - 'sdk/native/crypto-envelope/csharp/**'
      - 'sdk/native/crypto-envelope/ruby/**'
      - 'sdk/native/crypto-candidate/**'
      - '.github/workflows/managed-reader.yml'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  managed-reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '8.0.x'
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          ruby-version: '3.3.9'
      - name: Check out independent maintained producer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: a5fb59c2c5bc81e80b5b8d4b836afd51c5304653
          path: producer
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.13.0'
      - name: Build independent producer and emit temporary fixture
        run: |
          npm ci --prefix producer/sdk/typescript
          npm run build --prefix producer/sdk/typescript
          node producer/sdk/native/sealed-candidate/python/produce-fixture.mjs | node sdk/native/crypto-envelope/java/reader/backdated-fixture.mjs | python3 sdk/native/crypto-envelope/java/reader/fixture_rows.py > "$RUNNER_TEMP/readers.tsv"
      - name: Java native reader
        run: |
          javac --release 17 -Xlint:all -Werror -d "$RUNNER_TEMP/reader-classes" sdk/native/crypto-envelope/java/*.java sdk/native/crypto-envelope/java/reader/*.java sdk/native/crypto-candidate/java/CandidateBody.java
          java -cp "$RUNNER_TEMP/reader-classes" org.zrotext.candidate.ReaderTest < "$RUNNER_TEMP/readers.tsv"
      - name: C# native reader
        run: dotnet run --project sdk/native/crypto-envelope/csharp/reader-tests/ReaderTest.csproj < "$RUNNER_TEMP/readers.tsv"
      - name: Ruby native reader
        run: ruby sdk/native/crypto-envelope/ruby/reader_test.rb < "$RUNNER_TEMP/readers.tsv"
