name: wolfssl-provenance
on:
  pull_request:
    paths:
      - 'android/app/src/main/cpp/wolfssl/**'
      - 'tools/make_wolfssl_provenance.py'
      - 'tools/verify_wolfssl_provenance.py'
      - '.github/workflows/wolfssl-provenance.yml'
  push:
    branches: [main]
    paths:
      - 'android/app/src/main/cpp/wolfssl/**'
      - 'tools/make_wolfssl_provenance.py'
      - 'tools/verify_wolfssl_provenance.py'
      - '.github/workflows/wolfssl-provenance.yml'
permissions:
  contents: read
jobs:
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Clone pinned upstream
        run: |
          git clone --filter=blob:none --no-checkout --single-branch \
            --branch v5.9.4-stable https://github.com/wolfSSL/wolfssl.git /tmp/wolfssl-upstream
          git -C /tmp/wolfssl-upstream checkout 3c5eead44904df64e6a5a1f4ebdce377d35a849a
          test "$(git -C /tmp/wolfssl-upstream rev-parse HEAD)" = 3c5eead44904df64e6a5a1f4ebdce377d35a849a
      - name: Regenerate provenance from upstream and fail on drift
        run: |
          python3 tools/make_wolfssl_provenance.py /tmp/wolfssl-upstream > /tmp/regen-PROVENANCE
          diff -u android/app/src/main/cpp/wolfssl/PROVENANCE /tmp/regen-PROVENANCE
      - name: Verify vendored tree against the committed manifest
        run: python3 tools/verify_wolfssl_provenance.py
      - name: Reject deliberate bad-commit plantings
        run: python3 tools/verify_wolfssl_provenance.py --self-test
