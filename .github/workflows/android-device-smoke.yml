name: Android no-radio device smoke
on:
  pull_request:
    paths:
      - 'android/**'
      - 'protocol/v1/vectors/**'
      - 'sdk/typescript/test/vectors/**'
      - 'scripts/android_device_smoke.py'
      - 'scripts/tests/test_android_device_smoke.py'
      - 'scripts/android_preparation_probe.py'
      - 'scripts/tests/test_android_preparation_probe.py'
      - '.github/workflows/android-device-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'protocol/v1/vectors/**'
      - 'sdk/typescript/test/vectors/**'
      - 'scripts/android_device_smoke.py'
      - 'scripts/tests/test_android_device_smoke.py'
      - 'scripts/android_preparation_probe.py'
      - 'scripts/tests/test_android_preparation_probe.py'
      - '.github/workflows/android-device-smoke.yml'
permissions:
  contents: read
# A new push to a pull request cancels that pull request's older run. Every
# push to main gets its own group, so main runs are never canceled or queued.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  selected-device-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache Gradle distribution and dependencies
        # Open-source GitHub Actions cache provider; only main writes it.
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install existing target-level emulator and compile platform
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;28.2.13676358' 'emulator' 'system-images;android-36;google_apis;x86_64'
          rustup toolchain install 1.97.1 --profile minimal
          rustup target add --toolchain 1.97.1 aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
      - name: Build debug and test APKs
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --max-workers=2
      - name: Record compiled no-radio candidate identity
        run: |
          git rev-parse HEAD > candidate-source-commit.txt
          git rev-parse 'HEAD^{tree}' > candidate-source-tree.txt
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk > candidate-apk-SHA256SUMS
      - name: Preserve compiled candidate for emulator-only diagnosis
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: no-radio-debug-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            candidate-source-commit.txt
            candidate-source-tree.txt
            candidate-apk-SHA256SUMS
          if-no-files-found: error
          retention-days: 3
      - name: Run only selected no-radio tests on a disposable emulator
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
          test -z "$(adb devices | tail -n +2 | tr -d '[:space:]')"
          echo no | avdmanager create avd -n zrotext_ci_smoke -k 'system-images;android-36;google_apis;x86_64'
          "$ANDROID_HOME/emulator/emulator" -avd zrotext_ci_smoke -port 5562 -no-window -no-audio -no-snapshot -wipe-data -gpu swiftshader_indirect >"$RUNNER_TEMP/emulator-smoke.log" 2>&1 &
          emulator_pid=$!
          trap 'adb -s emulator-5562 emu kill >/dev/null 2>&1 || true; kill "$emulator_pid" 2>/dev/null || true' EXIT
          timeout 240 bash -c 'until [ "$(adb -s emulator-5562 shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = 1 ]; do sleep 2; done'
          python3 scripts/android_device_smoke.py
          (cd android && ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest -PisolatedPreparationProbe=true --no-daemon --max-workers=2)
          python3 scripts/android_preparation_probe.py --serial emulator-5562
