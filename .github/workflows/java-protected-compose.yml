name: Java protected candidate composition
on:
  pull_request:
    paths:
      - 'sdk/native/crypto-envelope/java/**'
      - 'sdk/native/crypto-candidate/java/**'
      - '.github/workflows/java-protected-compose.yml'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  java-protected-compose:
    strategy:
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 304d512b7a420a3102278f32baed095f3e778989
          path: producer
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.13.0'
      - name: Build independent producer and consumer
        shell: pwsh
        run: |
          npm ci --prefix producer/sdk/typescript
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build --prefix producer/sdk/typescript
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Exercise native signer composition and exact replay
        run: python sdk/native/crypto-envelope/java/composition/run.py --producer producer
