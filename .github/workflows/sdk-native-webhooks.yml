name: Installed native webhook companions
on:
  pull_request:
    paths:
      - 'sdk/native/java/**'
      - 'sdk/native/csharp/**'
      - 'sdk/native/ruby/**'
      - 'sdk/native/webhook-vectors.tsv'
      - 'sdk/native/package-webhooks.py'
      - '.github/workflows/sdk-native-webhooks.yml'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  installed-webhooks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '8.0.x'
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          ruby-version: '3.3.9'
      - name: Build licensed archives and test installed webhook verification
        run: |
          python3 sdk/native/package-webhooks.py --target java --out "$RUNNER_TEMP/webhooks/java"
          python3 sdk/native/package-webhooks.py --target csharp --out "$RUNNER_TEMP/webhooks/csharp"
          python3 sdk/native/package-webhooks.py --target ruby --out "$RUNNER_TEMP/webhooks/ruby"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: experimental-webhook-packages
          path: ${{ runner.temp }}/webhooks
          if-no-files-found: error
          retention-days: 7
