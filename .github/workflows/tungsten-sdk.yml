name: Tungsten SDK generation
on:
  pull_request:
    paths:
      - 'sdk/tungsten/**'
      - 'protocol/v1/openapi/**'
      - 'scripts/*tungsten*'
      - '.github/workflows/tungsten-sdk.yml'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  generation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.13.0'
      - name: Test generation policy
        run: python3 -m unittest discover -s scripts -p 'test_tungsten_sdk.py'
      - name: Check out the locked generator
        shell: bash
        run: |
          revision=$(python3 -c 'import json; print(json.load(open("sdk/tungsten/generator.lock.json"))["revision"])')
          git clone -c core.autocrlf=false --no-checkout https://github.com/pboachie/tungsten.git "$RUNNER_TEMP/tungsten"
          git -C "$RUNNER_TEMP/tungsten" checkout --detach "$revision"
      - name: Generate and verify all targets
        run: python3 scripts/tungsten_sdk.py --source "$RUNNER_TEMP/tungsten" --check
      - name: Install the locked TypeScript build graph
        working-directory: sdk/tungsten/generated/typescript
        run: |
          cp ../../typescript.package-lock.json package-lock.json
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile and exercise synthetic TypeScript transport
        working-directory: sdk/tungsten/generated/typescript
        run: |
          npm run build
          node --test ../../contract.test.mjs
      - name: Install the generated Rust minimum toolchain
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Compile Rust SDK and CLI and Go against pinned runtime source
        run: python3 sdk/tungsten/check-rust-go.py --source "$RUNNER_TEMP/tungsten"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.401'
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          ruby-version: '3.3.9'
      - name: Compile Java and C# and load Ruby against pinned runtime source
        run: |
          python3 sdk/tungsten/check-managed.py --source "$RUNNER_TEMP/tungsten" --target java
          python3 sdk/tungsten/check-managed.py --source "$RUNNER_TEMP/tungsten" --target csharp
          python3 sdk/tungsten/check-managed.py --source "$RUNNER_TEMP/tungsten" --target ruby
      - name: Build and install generated Python wheels in an isolated consumer
        run: python3 sdk/tungsten/check-python.py --source "$RUNNER_TEMP/tungsten"
      - name: Build licensed deterministic source bundles
        run: python3 sdk/tungsten/package-sources.py --out "$RUNNER_TEMP/zrotext-sdk-sources"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: experimental-sdk-sources
          path: ${{ runner.temp }}/zrotext-sdk-sources
          if-no-files-found: error
          retention-days: 7
