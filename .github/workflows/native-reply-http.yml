name: Native original grant HTTPS transport
on:
  pull_request:
    paths: ['sdk/native/hpke-candidate/**', '.github/workflows/native-reply-http.yml']
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tls-transport:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        language: [rust, go]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography==46.0.4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.9'
          cache: false
      - run: rustup toolchain install 1.97.1 --profile minimal
      - name: Build native transport probe
        shell: pwsh
        env:
          RUSTUP_TOOLCHAIN: '1.97.1'
        run: |
          if ('${{ matrix.language }}' -eq 'rust') {
            cargo build --locked --manifest-path sdk/native/hpke-candidate/rust/Cargo.toml --example reply_http
          } else {
            Push-Location sdk/native/hpke-candidate/go
            $probe = "$env:RUNNER_TEMP/reply-http"
            if ($IsWindows) { $probe += '.exe' }
            go build -o $probe ./cmd/reply-http
            Pop-Location
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Actual local TLS single-attempt and full-body deadline controls
        shell: pwsh
        run: |
          $probe = "$env:RUNNER_TEMP/reply-http"
          if ($IsWindows) { $probe += '.exe' }
          if ('${{ matrix.language }}' -eq 'rust') {
            $probe = 'sdk/native/hpke-candidate/rust/target/debug/examples/reply_http'
            if ($IsWindows) { $probe += '.exe' }
          }
          python sdk/native/hpke-candidate/test-original-http.py --binary $probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
