name: Release server image
on:
  release:
    types: [published]
permissions: {}
concurrency:
  group: release-image-${{ github.event.release.tag_name }}
  cancel-in-progress: false
jobs:
  image:
    if: github.repository == 'pboachie/zrotext'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate annotated main-branch release tag
        run: |
          git fetch origin main
          python3 scripts/check_release_tag.py
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish from the validated source
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./deploy/compose/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/pboachie/zrotext:${{ github.ref_name }}-run${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.source=https://github.com/pboachie/zrotext
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          provenance: mode=max
          sbom: true
      - name: Stage the exact published image
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo 'Release image digest is invalid' >&2
            exit 1
          fi
          image_ref="ghcr.io/pboachie/zrotext@${IMAGE_DIGEST}"
          docker pull "$image_ref"
          docker tag "$image_ref" zrotext-release-smoke:local
      - name: Rehearse the exact published image
        timeout-minutes: 25
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          python3 deploy/compose/fresh_install_smoke.py \
            --image-ref "ghcr.io/pboachie/zrotext@${IMAGE_DIGEST}" \
            --source-commit "$GITHUB_SHA" \
            --source-tag "$GITHUB_REF_NAME"
      - name: Attest the published image digest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/pboachie/zrotext
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Record immutable release reference
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          python3 scripts/write_image_receipt.py \
            --tag "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" \
            --digest "$IMAGE_DIGEST" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --out "$RUNNER_TEMP/image-receipt.json"
      - name: Store digest receipt for maintainer review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: server-image-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/image-receipt.json
          if-no-files-found: error
          retention-days: 30
