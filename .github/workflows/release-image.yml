name: Release server image
on:
  release:
    types: [published]
env:
  DOCKER_BUILD_RECORD_UPLOAD: 'false'
permissions: {}
concurrency:
  group: release-image-${{ github.event.release.tag_name }}
  cancel-in-progress: false
jobs:
  image:
    if: github.repository == 'pboachie/zrotext'
    runs-on: ubuntu-24.04
    permissions:
      # write: attach the release's two assets; actions read: fetch the
      # Android candidate workflow's unsigned-APK artifact.
      actions: read
      contents: write
      packages: write
      attestations: write
      id-token: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate annotated main-branch release tag
        run: |
          git fetch origin main
          python3 scripts/check_release_tag.py
      - name: Compute embedded web, protocol and migration source metadata
        id: source_metadata
        run: |
          metadata="$(python3 scripts/release_source_metadata.py)"
          web_sha="$(jq -er .web_static_sha256 <<<"$metadata")"
          schema_sha="$(jq -er .device_stream_schema_sha256 <<<"$metadata")"
          migration_last="$(jq -er .migration_last <<<"$metadata")"
          if [[ ! "$web_sha" =~ ^[0-9a-f]{64}$ || ! "$schema_sha" =~ ^[0-9a-f]{64}$ || ! "$migration_last" =~ ^[1-9][0-9]*$ ]]; then
            echo 'Invalid release source metadata' >&2
            exit 1
          fi
          echo "web_sha=$web_sha" >> "$GITHUB_OUTPUT"
          echo "schema_sha=$schema_sha" >> "$GITHUB_OUTPUT"
          echo "migration_last=$migration_last" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish from the validated source
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./deploy/compose/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            RELEASE_VERSION=${{ github.ref_name }}
            WEB_STATIC_SHA256=${{ steps.source_metadata.outputs.web_sha }}
            DEVICE_STREAM_SCHEMA_SHA256=${{ steps.source_metadata.outputs.schema_sha }}
            MIGRATION_LAST=${{ steps.source_metadata.outputs.migration_last }}
          tags: ghcr.io/pboachie/zrotext:${{ github.ref_name }}-run${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.source=https://github.com/pboachie/zrotext
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.zrotext.web.static-sha256=${{ steps.source_metadata.outputs.web_sha }}
            org.zrotext.device-stream.schema-sha256=${{ steps.source_metadata.outputs.schema_sha }}
            org.zrotext.migration.last=${{ steps.source_metadata.outputs.migration_last }}
          provenance: mode=max
          sbom: true
      - name: Stage the exact published image
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo 'Release image digest is invalid' >&2
            exit 1
          fi
          image_ref="ghcr.io/pboachie/zrotext@${IMAGE_DIGEST}"
          docker pull "$image_ref"
          docker tag "$image_ref" zrotext-release-smoke:local
      - name: Scan published image for critical fixable vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: zrotext-release-smoke:local
          format: json
          output: trivy-release.json
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          version: v0.70.0
      - name: Store published image vulnerability report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: server-image-scan-${{ github.run_id }}-${{ github.run_attempt }}
          path: trivy-release.json
          if-no-files-found: warn
          retention-days: 30
      - name: Rehearse the exact published image
        timeout-minutes: 25
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          python3 deploy/compose/fresh_install_smoke.py \
            --image-ref "ghcr.io/pboachie/zrotext@${IMAGE_DIGEST}" \
            --source-commit "$GITHUB_SHA" \
            --source-tag "$GITHUB_REF_NAME" \
            --web-static-sha256 "${{ steps.source_metadata.outputs.web_sha }}" \
            --device-stream-schema-sha256 "${{ steps.source_metadata.outputs.schema_sha }}" \
            --migration-last "${{ steps.source_metadata.outputs.migration_last }}"
      - name: Require SPDX SBOM from the exact published image
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          python3 scripts/verify_published_sbom.py \
            --image-ref "ghcr.io/pboachie/zrotext@${IMAGE_DIGEST}" \
            --output "$RUNNER_TEMP/server-sbom.spdx.json"
      - name: Attest the published image digest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/pboachie/zrotext
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Attest the published image SPDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/pboachie/zrotext
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: ${{ runner.temp }}/server-sbom.spdx.json
          push-to-registry: true
          # GitHub storage records are limited to organization-owned repositories.
          create-storage-record: false
      - name: Record immutable release reference
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          python3 scripts/write_image_receipt.py \
            --tag "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" \
            --digest "$IMAGE_DIGEST" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --out "$RUNNER_TEMP/image-receipt.json"
      - name: Store digest receipt for maintainer review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: server-image-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/image-receipt.json
            trivy-release.json
          if-no-files-found: error
          retention-days: 30
      # The release carries exactly two assets: the server zip built here from
      # the exact published (and just-attested) image, and the unsigned APK
      # attached by the Android candidate workflow. The zip's binaries are the
      # image's binaries, so its provenance is the image digest above.
      - name: Bundle the server zip from the published image
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          name="zrotext-server-$tag-linux-amd64"
          bundle="$RUNNER_TEMP/$name"
          rm -rf "$bundle"; mkdir -p "$bundle/bin"
          cid=$(docker create "ghcr.io/pboachie/zrotext@${IMAGE_DIGEST}")
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          for binary in zrotext-server zrotext-admin zrotext-webhook-kek-rewrap zrotext-billing-risk-review zrotext-migrator; do
            docker cp "$cid:/usr/local/bin/$binary" "$bundle/bin/$binary"
          done
          docker cp "$cid:/opt/zrotext/migrations" "$bundle/migrations"
          docker cp "$cid:/usr/share/doc/zrotext" "$bundle/doc"
          install -m 644 deploy/compose/compose.yaml deploy/compose/runtime-role.sql deploy/compose/Caddyfile deploy/compose/README.md deploy/compose/UPGRADE.md LICENSE "$bundle/"
          cat >"$bundle/BUNDLE-README.md" <<README
          # ZROtext server bundle $tag

          Self-hosting bundle extracted from the attested release image
          \`ghcr.io/pboachie/zrotext@${IMAGE_DIGEST}\` built from tag \`$tag\`.
          The binaries under \`bin/\` are the image's own binaries; \`migrations/\`
          and \`runtime-role.sql\` are the deployment's SQL sources, and
          \`compose.yaml\`/\`Caddyfile\` are the Compose stack from the tagged
          source. Prefer running the image directly with \`docker compose\`; this
          bundle mirrors it for hosts that cannot pull from GHCR. Corresponding
          source: https://github.com/pboachie/zrotext/tree/$tag (AGPL-3.0-only).
          README
          (cd "$RUNNER_TEMP" && zip -q -r "$name.zip" "$name")
          sha256sum "$RUNNER_TEMP/$name.zip"
      - name: Attach the server zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/zrotext-server-$GITHUB_REF_NAME-linux-amd64.zip" --repo pboachie/zrotext --clobber
      - name: Wait for the unsigned APK candidate of this release
        timeout-minutes: 40
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 80); do
            runs=$(gh run list --repo pboachie/zrotext               --workflow android-release-candidate.yml --event release --limit 30               --json databaseId,headSha,conclusion)
            state=$(jq -er --arg sha "$GITHUB_SHA" '
              [ .[] | select(.headSha == $sha) ] |
              if any(.[]; .conclusion == "success") then "success"
              elif any(.[]; .conclusion == "failure") then "failure"
              else "pending" end' <<<"$runs")
            if [[ "$state" == success ]]; then echo 'APK candidate is ready.'; exit 0; fi
            if [[ "$state" == failure ]]; then
              echo '::error::The Android unsigned candidate workflow failed for this release; re-run it, then re-run this workflow. Never re-tag.' >&2
              exit 1
            fi
            sleep 30
          done
          echo '::error::Timed out waiting for the Android unsigned candidate workflow.' >&2
          exit 1
      - name: Attach the unsigned APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          dir="$RUNNER_TEMP/android-candidate"
          rm -rf "$dir"; mkdir -p "$dir"
          run_id=$(gh run list --repo pboachie/zrotext             --workflow android-release-candidate.yml --event release --limit 30             --json databaseId,headSha,conclusion --jq '
            [ .[] | select(.headSha == env.GITHUB_SHA and .conclusion == "success") ]
            | max_by(.databaseId) | .databaseId')
          test -n "$run_id" && test "$run_id" != null
          gh run download "$run_id" --repo pboachie/zrotext             --name "android-unsigned-candidate-$tag" --dir "$dir"
          asset="$RUNNER_TEMP/zrotext-$tag-unsigned.apk"
          cp "$dir/unsigned.apk" "$asset"
          sha256sum "$asset"
          gh release upload "$tag" "$asset" --repo pboachie/zrotext --clobber
