name: Managed native HPKE interoperability
on:
  pull_request:
    paths:
      - 'sdk/native/crypto-envelope/java/**'
      - 'sdk/native/crypto-envelope/csharp/**'
      - 'sdk/native/crypto-envelope/ruby/**'
      - '.github/workflows/managed-hpke.yml'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  managed-hpke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 4028720ca2b066ddd964e78b02efa1de01080cf4
          path: fixture-producer
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.13.0'
      - name: Generate independent ephemeral component vectors
        run: |
          npm ci --prefix fixture-producer/sdk/typescript --ignore-scripts --no-audit --no-fund
          node fixture-producer/sdk/typescript/test/emit-native-hpke.mjs --tsv > "$RUNNER_TEMP/hpke.tsv"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '8.0.x'
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          ruby-version: '3.3.9'
      - name: Java JCA receiver
        run: |
          javac --release 17 -Xlint:all -Werror -d "$RUNNER_TEMP/hpke-classes" sdk/native/crypto-envelope/java/*.java
          java -cp "$RUNNER_TEMP/hpke-classes" org.zrotext.candidate.HpkeTest < "$RUNNER_TEMP/hpke.tsv"
      - name: C# native receiver
        run: dotnet run --project sdk/native/crypto-envelope/csharp/HpkeTest.csproj < "$RUNNER_TEMP/hpke.tsv"
      - name: Ruby OpenSSL receiver
        run: ruby sdk/native/crypto-envelope/ruby/hpke_test.rb < "$RUNNER_TEMP/hpke.tsv"
