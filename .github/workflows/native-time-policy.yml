name: Native outbound03 time policy
on:
  pull_request:
    paths: ['sdk/native/hpke-candidate/**', '.github/workflows/native-time-policy.yml']
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  timing:
    strategy:
      fail-fast: false
      matrix:
        language: [rust, go]
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.13.0'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.9'
          cache: false
      - run: rustup toolchain install 1.97.1 --profile minimal
      - name: Build pinned shared signed-policy producer
        shell: pwsh
        run: |
          git clone -c core.autocrlf=false --no-checkout https://github.com/pboachie/zrotext.git "$env:RUNNER_TEMP/time-policy"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C "$env:RUNNER_TEMP/time-policy" checkout --detach 034ccd0a7390a5451745e885e5ffca94f9bbb633
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --prefix "$env:RUNNER_TEMP/time-policy/sdk/typescript" --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build --prefix "$env:RUNNER_TEMP/time-policy/sdk/typescript"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Conditional actual protected policy qualification
        shell: pwsh
        env:
          RUSTUP_TOOLCHAIN: '1.97.1'
        run: |
          python sdk/native/hpke-candidate/run-time-policy.py --language '${{ matrix.language }}' --producer "$env:RUNNER_TEMP/time-policy"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
