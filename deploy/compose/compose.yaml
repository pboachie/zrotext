name: zrotext
x-app: &app
  build:
    context: ../..
    dockerfile: deploy/compose/Dockerfile
  depends_on:
    db:
      condition: service_healthy
    db-runtime:
      condition: service_completed_successfully
  read_only: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  restart: unless-stopped
  networks: [private]
services:
  db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: zrotext
      POSTGRES_USER: zrotext
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zrotext -d zrotext"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    networks: [private]
  migrate:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/usr/local/bin/zrotext-migrator"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      MIGRATIONS_DIR: /opt/zrotext/migrations
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: "no"
    networks: [private]
  # Provision after migrations; explicitly rerun on upgrades as documented.
  db-runtime:
    image: postgres:18.6-bookworm
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGHOST: db
      PGUSER: zrotext
      PGDATABASE: zrotext
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      RUNTIME_DATABASE_PASSWORD: ${RUNTIME_DATABASE_PASSWORD:?set a separate 64-character hexadecimal RUNTIME_DATABASE_PASSWORD}
    entrypoint: ["psql", "-X", "-q", "-v", "ON_ERROR_STOP=1", "-f", "/opt/runtime-role.sql"]
    volumes:
      - ./runtime-role.sql:/opt/runtime-role.sql:ro
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: "no"
    networks: [private]
  app:
    <<: *app
    environment:
      DATABASE_URL: postgres://zrotext_runtime:${RUNTIME_DATABASE_PASSWORD:?set RUNTIME_DATABASE_PASSWORD}@db:5432/zrotext
      SITE_ID: ${SITE_ID:-local-a}
      INSTANCE_ID: ${INSTANCE_ID:-api-1}
      DEPLOYMENT_EPOCH: ${DEPLOYMENT_EPOCH:-1}
      DISPATCH_ENABLED: "false"
      BIND_ADDR:
      SOURCE_URL:
      SYNTHETIC_ALPHA_ENABLED:
      SYNTHETIC_ALPHA_ALLOWED_ACCOUNT_IDS:
      SYNTHETIC_ALPHA_ALLOWED_RECIPIENTS:
      INBOUND_PILOT_ENABLED:
      ZT_DEVICE_STREAM_DIAGNOSTIC:
      M0_TEST_TOKEN: ${M0_TEST_TOKEN:-}
      AUTH_ORIGIN:
      AUTH_TOKEN_PEPPER_B64:
      ENROLLMENT_TOKEN_PEPPER_B64:
      SMTP_HOST:
      SMTP_PORT:
      SMTP_SECURE:
      SMTP_USERNAME:
      SMTP_PASSWORD:
      SMTP_FROM:
      SMTP_FROM_NAME:
      SMTP_REPLY_TO:
      SMTP_USER:
      SMTP_PASS:
      EMAIL_FROM:
      EMAIL_FROM_NAME:
      EMAIL_REPLY_TO:
      MFA_ENCRYPTION_KEY_B64: ${MFA_ENCRYPTION_KEY_B64:-}
      MFA_ENROLLMENT_ENABLED: ${MFA_ENROLLMENT_ENABLED:-false}
      MFA_RECOVERY_ONLY: ${MFA_RECOVERY_ONLY:-false}
      WEBHOOK_KEK_VERSION:
      WEBHOOK_KEK_B64:
      WEBHOOK_KEK_SECONDARY_VERSION:
      WEBHOOK_KEK_SECONDARY_B64:
      WEBHOOK_DELIVERY_ENABLED:
      STRIPE_BILLING_TEST_ENABLED:
      STRIPE_TEST_WEBHOOK_SECRET:
      STRIPE_TEST_PRICE_IDS:
      STRIPE_TEST_QUOTA_PLANS:
      STRIPE_TEST_HOSTED_SESSIONS_ENABLED:
      STRIPE_TEST_CHECKOUT_PRICE_ID:
      STRIPE_TEST_RECONCILE_SECRET_KEY:
      STRIPE_TEST_SESSION_SECRET_KEY:
      STRIPE_TEST_SECRET_KEY:
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
  app_b:
    <<: *app
    profiles: [two-hub]
    environment:
      DATABASE_URL: postgres://zrotext_runtime:${RUNTIME_DATABASE_PASSWORD:?set RUNTIME_DATABASE_PASSWORD}@db:5432/zrotext
      SITE_ID: local-b
      INSTANCE_ID: api-2
      DEPLOYMENT_EPOCH: ${DEPLOYMENT_EPOCH:-1}
      DISPATCH_ENABLED: "false"
      BIND_ADDR:
      SOURCE_URL:
      SYNTHETIC_ALPHA_ENABLED:
      SYNTHETIC_ALPHA_ALLOWED_ACCOUNT_IDS:
      SYNTHETIC_ALPHA_ALLOWED_RECIPIENTS:
      INBOUND_PILOT_ENABLED:
      ZT_DEVICE_STREAM_DIAGNOSTIC:
      M0_TEST_TOKEN: ${M0_TEST_TOKEN:-}
      AUTH_ORIGIN:
      AUTH_TOKEN_PEPPER_B64:
      ENROLLMENT_TOKEN_PEPPER_B64:
      SMTP_HOST:
      SMTP_PORT:
      SMTP_SECURE:
      SMTP_USERNAME:
      SMTP_PASSWORD:
      SMTP_FROM:
      SMTP_FROM_NAME:
      SMTP_REPLY_TO:
      SMTP_USER:
      SMTP_PASS:
      EMAIL_FROM:
      EMAIL_FROM_NAME:
      EMAIL_REPLY_TO:
      MFA_ENCRYPTION_KEY_B64: ${MFA_ENCRYPTION_KEY_B64:-}
      MFA_ENROLLMENT_ENABLED: ${MFA_ENROLLMENT_ENABLED:-false}
      MFA_RECOVERY_ONLY: ${MFA_RECOVERY_ONLY:-false}
      WEBHOOK_KEK_VERSION:
      WEBHOOK_KEK_B64:
      WEBHOOK_KEK_SECONDARY_VERSION:
      WEBHOOK_KEK_SECONDARY_B64:
      WEBHOOK_DELIVERY_ENABLED:
      STRIPE_BILLING_TEST_ENABLED:
      STRIPE_TEST_WEBHOOK_SECRET:
      STRIPE_TEST_PRICE_IDS:
      STRIPE_TEST_QUOTA_PLANS:
      STRIPE_TEST_HOSTED_SESSIONS_ENABLED:
      STRIPE_TEST_CHECKOUT_PRICE_ID:
      STRIPE_TEST_RECONCILE_SECRET_KEY:
      STRIPE_TEST_SESSION_SECRET_KEY:
      STRIPE_TEST_SECRET_KEY:
    ports:
      - "127.0.0.1:8081:8080"
volumes:
  pgdata:
networks:
  private:
    internal: false
