name: zrotext
x-app: &app
  build:
    context: ../..
    dockerfile: deploy/compose/Dockerfile
  depends_on:
    db:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  read_only: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  restart: unless-stopped
  networks: [private]
services:
  db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: zrotext
      POSTGRES_USER: zrotext
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zrotext -d zrotext"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    networks: [private]
  migrate:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/usr/local/bin/zrotext-migrator"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      MIGRATIONS_DIR: /opt/zrotext/migrations
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: "no"
    networks: [private]
  app:
    <<: *app
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      SITE_ID: ${SITE_ID:-local-a}
      INSTANCE_ID: ${INSTANCE_ID:-api-1}
      DEPLOYMENT_EPOCH: ${DEPLOYMENT_EPOCH:-1}
      DISPATCH_ENABLED: "false"
      M0_TEST_TOKEN: ${M0_TEST_TOKEN:-}
      AUTH_ORIGIN:
      AUTH_TOKEN_PEPPER_B64:
      ENROLLMENT_TOKEN_PEPPER_B64:
      SMTP_HOST:
      SMTP_PORT:
      SMTP_USERNAME:
      SMTP_PASSWORD:
      SMTP_FROM:
      SMTP_FROM_NAME:
      SMTP_REPLY_TO:
      MFA_ENCRYPTION_KEY_B64: ${MFA_ENCRYPTION_KEY_B64:-}
      MFA_ENROLLMENT_ENABLED: ${MFA_ENROLLMENT_ENABLED:-false}
      MFA_RECOVERY_ONLY: ${MFA_RECOVERY_ONLY:-false}
    ports:
      - "127.0.0.1:8080:8080"
  app_b:
    <<: *app
    profiles: [two-hub]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      SITE_ID: local-b
      INSTANCE_ID: api-2
      DEPLOYMENT_EPOCH: ${DEPLOYMENT_EPOCH:-1}
      DISPATCH_ENABLED: "false"
      M0_TEST_TOKEN: ${M0_TEST_TOKEN:-}
      AUTH_ORIGIN:
      AUTH_TOKEN_PEPPER_B64:
      ENROLLMENT_TOKEN_PEPPER_B64:
      SMTP_HOST:
      SMTP_PORT:
      SMTP_USERNAME:
      SMTP_PASSWORD:
      SMTP_FROM:
      SMTP_FROM_NAME:
      SMTP_REPLY_TO:
      MFA_ENCRYPTION_KEY_B64: ${MFA_ENCRYPTION_KEY_B64:-}
      MFA_ENROLLMENT_ENABLED: ${MFA_ENROLLMENT_ENABLED:-false}
      MFA_RECOVERY_ONLY: ${MFA_RECOVERY_ONLY:-false}
    ports:
      - "127.0.0.1:8081:8080"
volumes:
  pgdata:
networks:
  private:
    internal: false
