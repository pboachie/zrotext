<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZROtext experimental workflow tools</title>
<h1>Experimental workflow tools</h1>
<p>This separate application exposes only its configured workflow tools. Registration does not approve an action or send a message.</p>
<form id="login"><label>Application access key <input id="access" type="password" autocomplete="off" required></label><button>Sign in</button></form>
<button id="register" disabled>Register workflow tools</button><button id="logout" disabled>Sign out</button>
<p id="status" role="status">Signed out. No tools registered.</p>
<script type="module" src="/app.mjs"></script>
</html>
