[package]
name = "zrotext-candidate-body"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "AGPL-3.0-only"
description = "Candidate authenticated AES-GCM body primitive for ZROtext"
repository = "https://github.com/pboachie/zrotext"
readme = "README.md"
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]
[workspace]
[dependencies]
aes-gcm = { version = "0.11.1", features = ["zeroize"] }
zeroize = "1.9.0"
[dev-dependencies]
getrandom = "0.4"
serde_json = "1"
