[package]
name = "zrotext-delivery-store"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
zrotext-domain = { path = "../domain" }
# 0.7.17 added execute_typed, query_typed_one and query_typed_opt.
tokio-postgres = { version = "0.7.17", features = ["with-uuid-1"] }
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "sync"] }
uuid.workspace = true
sha2 = "0.11.0"
thiserror = "2.0.20"

[dev-dependencies]
# Wire-level test proxy counts extended-protocol round trips per statement.
tokio = { version = "1.47.1", features = ["net", "io-util"] }
