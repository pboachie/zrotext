[package]
name = "zrotext-root-bundle"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
zrotext-root-material = { path = "../root-material" }
sha2 = "0.11.0"
thiserror = "2.0.16"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading"] }

[dev-dependencies]
serde_json.workspace = true

[target.'cfg(windows)'.dev-dependencies]
# Test-only: resolve the per-user profile directory for test directories.
windows-sys = { version = "0.61.2", features = ["Win32_UI_Shell"] }
