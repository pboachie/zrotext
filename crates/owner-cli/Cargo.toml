[package]
name = "zrotext-owner"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
# Candidate offline unlock signing, disabled by default: the default build has
# no unlock command at all, and no release artifact or workflow enables this.
unlock = ["zrotext-root-material/unlock"]

[target.'cfg(windows)'.dependencies]
zrotext-root-material = { path = "../root-material" }
zrotext-root-bundle = { path = "../root-bundle" }
zrotext-root-terminal = { path = "../root-terminal" }
p256 = { version = "0.14.0", features = ["ecdsa", "pkcs8"] }
rand = "0.10.2"
sha2 = { version = "0.11.0", features = ["zeroize"] }
zeroize = "1.9.0"
uuid.workspace = true
windows-sys = { version = "0.61.2", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_UI_Shell", "Win32_System_Com"] }

[target.'cfg(windows)'.dev-dependencies]
# Bounded public JSON transport for cfg(test)-only local setup callbacks.
serde_json.workspace = true
windows-sys = { version = "0.61.2", features = ["Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
