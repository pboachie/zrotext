[package]
name = "zrotext-root-material"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
data-encoding = "2.11.1"
aes-gcm = { version = "0.11.1", features = ["zeroize"] }
hkdf = "0.13.0"
hmac = { version = "0.13.0", features = ["zeroize"] }
p256 = { version = "0.14.0", features = ["ecdsa", "pkcs8"] }
rand = "0.10.2"
sha2 = { version = "0.11.0", features = ["zeroize"] }
thiserror = "2.0.16"
url = "2.5.8"
zeroize = "1.9.0"

[dev-dependencies]
serde_json.workspace = true
