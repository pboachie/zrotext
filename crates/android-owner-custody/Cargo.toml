[package]
name = "zrotext-android-owner-custody"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "zrotext_android_owner_custody"
crate-type = ["rlib", "cdylib"]

[dependencies]
zrotext-root-material = { path = "../root-material", features = ["unlock"] }
p256 = { version = "0.14.0", features = ["ecdsa", "pkcs8"] }
rand = "0.10.2"
sha2 = { version = "0.11.0", features = ["zeroize"] }
zeroize = "1.9.0"
thiserror = "2.0.16"
serde.workspace = true
serde_json.workspace = true
# A narrow JNI ABI with bounded copies; no managed private-key callbacks.
jni = { version = "0.21.1", default-features = false }

[dev-dependencies]
serde_json.workspace = true
