[package]
name = "zrotext-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
zrotext-domain = { path = "../domain" }
zrotext-delivery-store = { path = "../delivery-store" }
axum = { version = "0.8.6", features = ["ws"] }
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tokio-postgres = { version = "0.7.13", features = ["with-uuid-1"] }
subtle = "2.6.1"
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
argon2 = "0.6.0"
base64 = "0.23.1"
hmac = "0.13.0"
rand = "0.10.2"
sha2 = "0.11.0"
thiserror = "2.0.16"
p256 = { version = "0.13.2", features = ["ecdsa", "pkcs8"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
aes-gcm = "0.11.1"
zeroize = "1.9.0"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
