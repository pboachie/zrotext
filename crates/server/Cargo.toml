[package]
name = "zrotext-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
zrotext-domain = { path = "../domain" }
axum = { version = "0.8.6", features = ["ws"] }
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tokio-postgres = { version = "0.7.13", features = ["with-uuid-1"] }
subtle = "2.6.1"
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
argon2 = "0.5.3"
base64 = "0.22.1"
hmac = "0.12.1"
rand = "0.8.5"
sha2 = "0.11.0"
thiserror = "2.0.16"
p256 = { version = "0.13.2", features = ["ecdsa", "pkcs8"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
