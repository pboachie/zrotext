<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Billing · ZROtext</title>
<main>
  <h1>Billing test mode</h1>
  <p>This page shows locally reconciled Stripe test records. A Checkout or Portal return does not confirm payment or access.</p>
  <p id="billing-state" role="status">Loading billing status…</p>
  <p id="device-cap-status" role="status"></p>
  <p><a id="manage-devices" href="/owner/devices#approved-devices" hidden>Choose devices to revoke</a></p>
  <ul id="subscriptions"></ul>
  <p id="billing-error" role="alert"></p>
  <button id="checkout" type="button">Open test Checkout</button>
  <button id="portal" type="button" disabled>Open customer portal</button>
  <button id="refresh" type="button">Refresh status</button>
</main>
<footer><a href="/source">Source code for this server</a></footer>
<script src="/billing/dashboard.js" defer></script>
</html>
