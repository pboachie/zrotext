[workspace]
members = ["crates/domain", "crates/root-material", "crates/android-owner-custody", "crates/root-bundle", "crates/root-terminal", "crates/owner-cli", "crates/server", "crates/device-sim", "crates/delivery-store", "crates/migrator", "crates/postgres-connection", "crates/failover-quorum"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
license = "AGPL-3.0-only"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
uuid = { version = "1.18.1", features = ["serde", "v4"] }

# The dev profile compiles dependency crates at opt-level 0 by default, which
# makes the argon2 and p256 primitives many times slower than their optimized
# builds and dominates the runtime of the auth-heavy PostgreSQL test suites.
# Overriding only opt-level for these two packages leaves every other dev
# profile setting — including debug assertions and overflow checks — inherited
# and unchanged, and has no effect on release builds.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.p256]
opt-level = 3

# Smaller, faster server image binaries. `strip = "symbols"` drops the symbol
# table, so a RUST_BACKTRACE shows addresses instead of function names; the
# panic message still names the source file and line. Thin LTO and one codegen
# unit let rustc optimize across crates at the cost of a longer release build.
[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
